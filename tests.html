<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Draft Cockpit Tests</title>
  <style>
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; padding: 16px; }
    .test-line { font-size: 13px; line-height: 20px; font-family: ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
    .test-line.pass { color: #30D158; }
    .test-line.fail { color: #FF453A; }
    .section-line { font-size: 15px; font-weight: 700; margin-top: 16px; color: rgba(255,255,255,0.6); }
    #test-summary { font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  </style>
</head>
<body>
  <!-- no data-pass/data-fail/data-complete here on purpose: their absence is what lets
       run-tests.ps1 detect a crash that happens before the render script below ever runs -->
  <div id="test-summary">TESTS: running…</div>
  <div id="test-output"></div>

  <!-- GitHub Pages serves this file from the app's own origin, so tests that write/remove
       the real state key would stomp a live draft on a single visit. Snapshot it here, as
       the very first script in the file (before state.js loads, hence the literal string
       rather than DC.state.STORAGE_KEY), and restore it in the final render script below
       after every test section has run. Literal must match STORAGE_KEY in js/state.js. -->
  <script>
    window.__DC_REAL_STATE_SNAPSHOT__ = localStorage.getItem('draft-cockpit/state');
  </script>

  <!-- app scripts under test (later tasks append more script tags here, before the harness) -->
  <script src="./js/data.js"></script>
  <script src="./js/adp-data.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/importer.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/edit.js"></script>
  <script src="./js/compare.js"></script>

  <!-- harness (defined before test sections) -->
  <script>
    (function () {
      'use strict';

      var results = [];
      var currentSection = '';
      var declaredSections = []; // unique section names, in declaration order
      var sectionCounts = {}; // section name -> number of t() results registered under it

      function section(title) {
        currentSection = title;
        if (declaredSections.indexOf(title) === -1) {
          declaredSections.push(title);
        }
      }

      function assert(cond, msg) {
        if (!cond) {
          throw new Error(msg || 'assertion failed');
        }
      }

      function deepEqual(a, b) {
        if (a === b) {
          return true;
        }
        if (typeof a === 'object' && a !== null && typeof b === 'object' && b !== null) {
          return JSON.stringify(a) === JSON.stringify(b);
        }
        return false;
      }

      function assertEq(actual, expected, msg) {
        if (!deepEqual(actual, expected)) {
          var prefix = msg ? msg + ' — ' : '';
          throw new Error(prefix + 'expected=' + JSON.stringify(expected) + ' actual=' + JSON.stringify(actual));
        }
      }

      function t(name, fn) {
        var entry = { section: currentSection, name: name, pass: true, detail: '' };
        try {
          fn();
        } catch (e) {
          entry.pass = false;
          entry.detail = e && e.message ? e.message : String(e);
        }
        results.push(entry);
        sectionCounts[currentSection] = (sectionCounts[currentSection] || 0) + 1;
      }

      window.section = section;
      window.t = t;
      window.assert = assert;
      window.assertEq = assertEq;
      window.__DC_TEST_RESULTS__ = results;
      window.__DC_TEST_SECTIONS__ = declaredSections;
      window.__DC_TEST_SECTION_COUNTS__ = sectionCounts;
    })();
  </script>

  <!-- test sections (later tasks append their own <script> blocks here) -->
  <script>
    section('data');

    t('SEED_PLAYERS.length is between 265 and 295', function () {
      var n = DC.data.SEED_PLAYERS.length;
      assert(n >= 265 && n <= 295, 'length=' + n);
    });

    t('all player ids are unique', function () {
      var seen = {};
      DC.data.SEED_PLAYERS.forEach(function (p) {
        assert(!seen[p.id], 'duplicate id: ' + p.id);
        seen[p.id] = true;
      });
    });

    t('ranks are exactly 1..N in array order', function () {
      DC.data.SEED_PLAYERS.forEach(function (p, i) {
        assertEq(p.rank, i + 1, 'rank at index ' + i);
      });
    });

    t('every player team exists in TEAM_BYE_WEEKS and byeWeek matches', function () {
      DC.data.SEED_PLAYERS.forEach(function (p) {
        assert(Object.prototype.hasOwnProperty.call(DC.data.TEAM_BYE_WEEKS, p.team), 'unknown team: ' + p.team);
        assertEq(p.byeWeek, DC.data.TEAM_BYE_WEEKS[p.team], 'byeWeek for ' + p.id);
      });
    });

    t('every position is QB, RB, WR, TE, DST, or K', function () {
      var valid = { QB: true, RB: true, WR: true, TE: true, DST: true, K: true };
      DC.data.SEED_PLAYERS.forEach(function (p) {
        assert(valid[p.position], 'invalid position: ' + p.position + ' for ' + p.id);
      });
    });

    t('position mix meets minimums (>=15 QB, >=50 RB, >=70 WR, >=20 TE, >=8 K, >=8 DST)', function () {
      var counts = { QB: 0, RB: 0, WR: 0, TE: 0, DST: 0, K: 0 };
      DC.data.SEED_PLAYERS.forEach(function (p) {
        counts[p.position] = (counts[p.position] || 0) + 1;
      });
      assert(counts.QB >= 15, 'QB=' + counts.QB);
      assert(counts.RB >= 50, 'RB=' + counts.RB);
      assert(counts.WR >= 70, 'WR=' + counts.WR);
      assert(counts.TE >= 20, 'TE=' + counts.TE);
      assert(counts.K >= 8, 'K=' + counts.K);
      assert(counts.DST >= 8, 'DST=' + counts.DST);
    });

    t('TEAM_BYE_WEEKS has exactly 32 keys, all byes ints 5-14', function () {
      var keys = Object.keys(DC.data.TEAM_BYE_WEEKS);
      assertEq(keys.length, 32, 'key count');
      keys.forEach(function (k) {
        var w = DC.data.TEAM_BYE_WEEKS[k];
        assert(Number.isInteger(w) && w >= 5 && w <= 14, k + ' bye=' + w);
      });
    });

    t('slug behavior matches contract', function () {
      assertEq(DC.data.slug("Ja'Marr Chase", "CIN"), 'ja-marr-chase-cin', 'chase slug');
      assertEq(DC.data.slug('Amon-Ra St. Brown', 'DET'), 'amon-ra-st-brown-det', 'st brown slug');
    });

    t('no run of more than 7 consecutive same-position players from rank 30 onward', function () {
      var tail = DC.data.SEED_PLAYERS.filter(function (p) { return p.rank >= 30; });
      var maxRun = 0;
      var curRun = 0;
      var curPos = null;
      var firstViolation = null;
      tail.forEach(function (p) {
        if (p.position === curPos) {
          curRun++;
        } else {
          curPos = p.position;
          curRun = 1;
        }
        if (curRun > maxRun) {
          maxRun = curRun;
        }
        if (curRun > 7 && firstViolation === null) {
          firstViolation = 'first violation at rank ' + p.rank + ' (' + p.position + ')';
        }
      });
      assert(maxRun <= 7, 'max run=' + maxRun + (firstViolation ? '; ' + firstViolation : ''));
    });
  </script>

  <!-- Task 2: adp-data.js sidecar table (shape/liveness only - values are live data, never asserted) -->
  <script>
  (function () {
    'use strict';
    section('adp-data');

    t('DC.adpData exists with well-shaped updatedAt/season/scoring/players', function () {
      assert(DC.adpData && typeof DC.adpData === 'object', 'DC.adpData missing');
      assert(/^\d{4}-\d{2}-\d{2}$/.test(DC.adpData.updatedAt), 'updatedAt shape: ' + DC.adpData.updatedAt);
      assert(!isNaN(new Date(DC.adpData.updatedAt).getTime()), 'updatedAt not parseable as a date');
      assert(typeof DC.adpData.season === 'number', 'season not a number');
      assertEq(DC.adpData.scoring, 'ppr');
      assert(DC.adpData.players && typeof DC.adpData.players === 'object' && !Array.isArray(DC.adpData.players), 'players not a plain object');
    });

    t('players table has at least 300 entries', function () {
      var n = Object.keys(DC.adpData.players).length;
      assert(n >= 300, 'entry count=' + n);
    });

    t('every key matches /^[a-z0-9]+|(qb|rb|wr|te|k|dst)$/', function () {
      var keyPattern = /^[a-z0-9]+\|(qb|rb|wr|te|k|dst)$/;
      Object.keys(DC.adpData.players).forEach(function (k) {
        assert(keyPattern.test(k), 'bad key: ' + k);
      });
    });

    t('every entry has >=1 source, only espn/yahoo/sleeper keys, values finite numbers in [1, 500)', function () {
      var validSources = { espn: true, yahoo: true, sleeper: true };
      Object.keys(DC.adpData.players).forEach(function (k) {
        var entry = DC.adpData.players[k];
        var sourceKeys = Object.keys(entry);
        assert(sourceKeys.length >= 1, 'no sources for ' + k);
        sourceKeys.forEach(function (src) {
          assert(validSources[src], 'unexpected source "' + src + '" on ' + k);
          var v = entry[src];
          assert(typeof v === 'number' && isFinite(v) && v >= 1 && v < 500, 'bad value for ' + k + '.' + src + ': ' + v);
        });
      });
    });

    t('join-liveness: >=80 of the first 100 SEED_PLAYERS resolve via adpKey', function () {
      var first100 = DC.data.SEED_PLAYERS.slice(0, 100);
      var hits = 0;
      first100.forEach(function (p) {
        var key = DC.state.adpKey(p);
        if (key && Object.prototype.hasOwnProperty.call(DC.adpData.players, key)) {
          hits++;
        }
      });
      assert(hits >= 80, 'hits=' + hits + '/100');
    });

    t('DST liveness: >=10 of the seed DSTs resolve via adpKey', function () {
      var dsts = DC.data.SEED_PLAYERS.filter(function (p) { return p.position === 'DST'; });
      var hits = 0;
      dsts.forEach(function (p) {
        var key = DC.state.adpKey(p);
        if (key && Object.prototype.hasOwnProperty.call(DC.adpData.players, key)) {
          hits++;
        }
      });
      assert(hits >= 10, 'hits=' + hits + '/' + dsts.length);
    });

    t('DC.adpData.images exists, is a plain object, >=200 entries', function () {
      assert(DC.adpData.images && typeof DC.adpData.images === 'object' && !Array.isArray(DC.adpData.images), 'images not a plain object');
      var n = Object.keys(DC.adpData.images).length;
      assert(n >= 200, 'entry count=' + n);
    });

    t('every images key also exists in DC.adpData.players', function () {
      Object.keys(DC.adpData.images).forEach(function (k) {
        assert(Object.prototype.hasOwnProperty.call(DC.adpData.players, k), 'images key not in players: ' + k);
      });
    });

    t('every images value is a positive integer', function () {
      Object.keys(DC.adpData.images).forEach(function (k) {
        var v = DC.adpData.images[k];
        assert(Number.isInteger(v) && v > 0, 'bad image id for ' + k + ': ' + v);
      });
    });

    t('no images key ends in |dst', function () {
      Object.keys(DC.adpData.images).forEach(function (k) {
        assert(!/\|dst$/.test(k), 'dst key found in images: ' + k);
      });
    });
  })();
  </script>

  <!-- Task 3: state store tests (reducer / selectors / search / persistence) -->
  <script>
  (function () {
    'use strict';
    section('state');

    function makePlayers() {
      return [
        { id: 'a', rank: 1, name: 'Aaron Ace', team: 'KC', position: 'QB', byeWeek: 9 },
        { id: 'b', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'c', rank: 3, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10 },
        { id: 'd', rank: 4, name: 'Dave Deep', team: 'KC', position: 'TE', byeWeek: 9 },
        { id: 'e', rank: 5, name: 'Erik End', team: 'SEA', position: 'RB', byeWeek: 13 }
      ];
    }

    function makeMarks(players) {
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false };
      });
      return marks;
    }

    function makeBaseState() {
      var players = makePlayers();
      return {
        schemaVersion: 1,
        players: players,
        marks: makeMarks(players),
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: ''
      };
    }

    t('createSeedState: correct shape from DC.data.SEED_PLAYERS', function () {
      var s = DC.state.createSeedState();
      assertEq(s.schemaVersion, 6);
      s.players.forEach(function (p, i) {
        var seed = DC.data.SEED_PLAYERS[i];
        assertEq(p, { id: seed.id, rank: seed.rank, name: seed.name, team: seed.team, position: seed.position, byeWeek: seed.byeWeek, tier: seed.tier, adp: seed.adp }, 'seed player ' + i);
      });
      assertEq(s.undoStack, []);
      assertEq(s.filters, { position: 'ALL', status: 'AVAILABLE' });
      assertEq(s.searchText, '');
      assertEq(s.league, null);
      DC.data.SEED_PLAYERS.forEach(function (p) {
        assertEq(s.marks[p.id], { drafted: false, target: false, avoid: false, mine: false }, 'marks for ' + p.id);
      });
    });

    t('seed tier banding: boundary and tail spot-checks per position', function () {
      var byPosition = {};
      DC.data.SEED_PLAYERS.forEach(function (p) {
        byPosition[p.position] = byPosition[p.position] || [];
        byPosition[p.position].push(p);
      });
      assertEq(byPosition.QB[0].tier, 1, '1st QB should be tier 1');
      assertEq(byPosition.QB[3].tier, 2, '4th QB should be tier 2 (band boundary)');
      assertEq(byPosition.QB[21].tier, 7, '22nd QB should be tier 7 (tail)');
      assertEq(byPosition.RB[3].tier, 1, '4th RB should be tier 1');
      assertEq(byPosition.RB[4].tier, 2, '5th RB should be tier 2');
      for (var i = 54; i < byPosition.RB.length; i++) {
        assertEq(byPosition.RB[i].tier, 7, '55th RB and later should be tier 7 (index ' + i + ')');
      }
      assertEq(byPosition.K[10].tier, 4, '11th K should be tier 4');
      assertEq(byPosition.K[11].tier, 4, '12th K should be tier 4');
    });

    t('seed tier banding: monotone non-decreasing per position, and normalizeTiers is a no-op on the seed', function () {
      var seedState = DC.state.createSeedState();
      var lastTierByPosition = {};
      seedState.players.forEach(function (p) {
        var prev = lastTierByPosition[p.position];
        if (prev !== undefined) {
          assert(p.tier >= prev, 'tier should be non-decreasing within ' + p.position + ': prev=' + prev + ' next=' + p.tier);
        }
        lastTierByPosition[p.position] = p.tier;
      });
      assert(DC.state.normalizeTiers(seedState.players) === seedState.players, 'normalizeTiers should return the SAME reference — the seed is already normalized');
    });

    t('seed tier banding: no singleton (position,tier) groups at boot — no CLIFF tag fires', function () {
      assertEq(DC.state.lastInTierIds(DC.state.createSeedState()), {});
    });

    // ---- adp sidecar lookup + weighted consensus ----

    t('normalizeAdpName: lowercase, diacritic-free, punctuation-stripped, trailing generational suffix dropped', function () {
      assertEq(DC.state.normalizeAdpName("Ja'Marr Chase"), 'jamarrchase');
      assertEq(DC.state.normalizeAdpName('A.J. Brown'), 'ajbrown');
      assertEq(DC.state.normalizeAdpName('Kenneth Walker III'), 'kennethwalker');
      assertEq(DC.state.normalizeAdpName('Amon-Ra St. Brown'), 'amonrastbrown');
      assertEq(DC.state.normalizeAdpName('Brian Thomas Jr'), 'brianthomas');
      assertEq(DC.state.normalizeAdpName('José'), 'jose', 'diacritic stripped');
      assertEq(DC.state.normalizeAdpName('Vernon Jr Smith'), 'vernonjrsmith', 'suffix only stripped at the end, not mid-name');
    });

    t('adpKey: normal player keys on normalized name + position, lowercase', function () {
      assertEq(DC.state.adpKey({ name: "Ja'Marr Chase", team: 'CIN', position: 'WR' }), 'jamarrchase|wr');
    });

    t('adpKey: DST player keys on team, not name -> team|dst', function () {
      assertEq(DC.state.adpKey({ name: '49ers D/ST', team: 'SF', position: 'DST' }), 'sf|dst');
    });

    t('adpKey: missing or non-string name/team/position -> null', function () {
      assertEq(DC.state.adpKey({ team: 'CIN', position: 'WR' }), null, 'missing name');
      assertEq(DC.state.adpKey({ name: 'X', position: 'WR' }), null, 'missing team');
      assertEq(DC.state.adpKey({ name: 'X', team: 'CIN' }), null, 'missing position');
      assertEq(DC.state.adpKey({ name: 5, team: 'CIN', position: 'WR' }), null, 'non-string name');
      assertEq(DC.state.adpKey(null), null, 'null player');
    });

    t('adpForPlayer: sidecar hit wins over player.adp', function () {
      var real = window.DC.adpData;
      try {
        window.DC.adpData = { players: { 'testhit|wr': { espn: 5, yahoo: 6, sleeper: 7 } } };
        var player = { name: 'Test Hit', team: 'AAA', position: 'WR', adp: { espn: 90, yahoo: 90, sleeper: 90 } };
        assertEq(DC.state.adpForPlayer(player), { espn: 5, yahoo: 6, sleeper: 7 });
      } finally {
        window.DC.adpData = real;
      }
    });

    t('adpForPlayer: sidecar miss falls back to player.adp', function () {
      var real = window.DC.adpData;
      try {
        window.DC.adpData = { players: {} };
        var player = { name: 'Test Miss', team: 'AAA', position: 'WR', adp: { espn: 1, yahoo: 2, sleeper: 3 } };
        assertEq(DC.state.adpForPlayer(player), { espn: 1, yahoo: 2, sleeper: 3 });
      } finally {
        window.DC.adpData = real;
      }
    });

    t('adpForPlayer: DC.adpData undefined falls back to player.adp', function () {
      var real = window.DC.adpData;
      try {
        window.DC.adpData = undefined;
        var player = { name: 'Test Undef', team: 'AAA', position: 'WR', adp: { espn: 8, yahoo: 8, sleeper: 8 } };
        assertEq(DC.state.adpForPlayer(player), { espn: 8, yahoo: 8, sleeper: 8 });
      } finally {
        window.DC.adpData = real;
      }
    });

    t('adpForPlayer: sidecar and player.adp both absent -> null', function () {
      var real = window.DC.adpData;
      try {
        window.DC.adpData = undefined;
        var player = { name: 'Test None', team: 'AAA', position: 'WR' };
        assertEq(DC.state.adpForPlayer(player), null);
      } finally {
        window.DC.adpData = real;
      }
    });

    t('load(): a v5 payload with real adp objects migrates to schemaVersion 6 with every player.adp forced null', function () {
      var payload = {
        schemaVersion: 5,
        players: [
          { id: 'mv1', rank: 1, name: 'MV One', team: 'KC', position: 'QB', byeWeek: 9, tier: null, adp: { espn: 5, yahoo: 6, sleeper: 4 } },
          { id: 'mv2', rank: 2, name: 'MV Two', team: 'DAL', position: 'RB', byeWeek: 7, tier: 1, adp: { espn: 40, yahoo: 38, sleeper: 42 } }
        ],
        marks: {
          mv1: { drafted: false, target: false, avoid: false, mine: false },
          mv2: { drafted: false, target: false, avoid: false, mine: false }
        },
        undoStack: [], filters: { position: 'ALL', status: 'AVAILABLE' }, searchText: '', manuallyEdited: false, league: null
      };
      localStorage.setItem(DC.state.STORAGE_KEY, JSON.stringify(payload));
      var loaded = DC.state.load();
      assertEq(loaded.schemaVersion, 6);
      loaded.players.forEach(function (p) {
        assertEq(p.adp, null, 'adp for ' + p.id + ' must be forced null by the v6 migration');
      });
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('reduce is pure: DRAFT_PLAYER does not mutate the original state', function () {
      var state = makeBaseState();
      var beforeMarksB = JSON.stringify(state.marks.b);
      var beforeUndoLen = state.undoStack.length;
      var next = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'b' });
      assertEq(JSON.stringify(state.marks.b), beforeMarksB, 'original marks.b mutated');
      assertEq(state.undoStack.length, beforeUndoLen, 'original undoStack mutated');
      assert(next !== state, 'expected a new state object');
      assert(next.marks !== state.marks, 'expected a new marks object');
    });

    t('DRAFT_PLAYER unknown id -> unchanged (same reference)', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'zzz' });
      assert(next === state, 'expected same reference for unknown id');
    });

    t('DRAFT_PLAYER already-drafted player -> unchanged (same reference)', function () {
      var state = makeBaseState();
      var afterDraft = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      var next = DC.state.reduce(afterDraft, { type: 'DRAFT_PLAYER', playerId: 'a' });
      assert(next === afterDraft, 'expected same reference for already-drafted player');
    });

    t('DRAFT_PLAYER: marks drafted, pushes undo entry, clears searchText', function () {
      var state = makeBaseState();
      state.searchText = 'foo';
      var next = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'c' });
      assertEq(next.marks.c.drafted, true);
      assertEq(next.undoStack.length, 1);
      assertEq(next.undoStack[0].playerId, 'c');
      assert(typeof next.undoStack[0].timestamp === 'number', 'timestamp should be a number');
      assertEq(next.searchText, '');
    });

    t('UNDO_DRAFT x3 pops in LIFO order', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'b' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'c' });
      assertEq(state.undoStack.map(function (e) { return e.playerId; }), ['a', 'b', 'c']);

      state = DC.state.reduce(state, { type: 'UNDO_DRAFT' });
      assertEq(state.marks.c.drafted, false, 'c undone first');
      assertEq(state.undoStack.map(function (e) { return e.playerId; }), ['a', 'b']);

      state = DC.state.reduce(state, { type: 'UNDO_DRAFT' });
      assertEq(state.marks.b.drafted, false, 'b undone second');
      assertEq(state.undoStack.map(function (e) { return e.playerId; }), ['a']);

      state = DC.state.reduce(state, { type: 'UNDO_DRAFT' });
      assertEq(state.marks.a.drafted, false, 'a undone third');
      assertEq(state.undoStack, []);
    });

    t('UNDO_DRAFT on empty stack -> unchanged (same reference)', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'UNDO_DRAFT' });
      assert(next === state, 'expected same reference on empty stack');
    });

    t('UNDRAFT_PLAYER mid-stack removes only that entry, shifts later pick numbers', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'b' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'c' });
      assertEq(DC.state.pickNumber(state, 'c'), 3);

      var next = DC.state.reduce(state, { type: 'UNDRAFT_PLAYER', playerId: 'b' });
      assertEq(next.marks.b.drafted, false);
      assertEq(next.undoStack.map(function (e) { return e.playerId; }), ['a', 'c']);
      assertEq(DC.state.pickNumber(next, 'c'), 2, 'c pick number shifts down after b removed');
      assertEq(DC.state.pickNumber(next, 'a'), 1);

      state = DC.state.reduce(state, { type: 'RESET_TARGETS_AVOID' });
      assertEq(state.marks.a.drafted, true, 'drafted should survive');
      assertEq(state.marks.b.target, false);
      assertEq(state.undoStack, stackBefore);

    t('CLEAR_ALL_DATA returns a fresh seed state', function () {

    t('IMPORT_PLAYERS reconciles marks and undoStack, resets filters/search', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'TOGGLE_TARGET', playerId: 'b' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'c' });
      state = DC.state.reduce(state, { type: 'SET_POSITION_FILTER', position: 'RB' });

      assertEq(state.undoStack.map(function (e) { return e.playerId; }), ['a', 'c']);

      var newPlayers = [

        { id: 'c', rank: 2, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10 },
        { id: 'z', rank: 3, name: 'Zeke New', team: 'NYG', position: 'RB', byeWeek: 12 }
      ];
      var next = DC.state.reduce(state, { type: 'IMPORT_PLAYERS', players: newPlayers });

      assertEq(next.players, newPlayers);
      assertEq(Object.keys(next.marks).sort(), ['b', 'c', 'z']);
      assertEq(next.marks.b, { drafted: false, target: true, avoid: false }, 'surviving mark for b preserved as-is');
      assertEq(next.marks.c, { drafted: true, target: false, avoid: false, mine: false }, 'surviving mark for c preserved as-is (still drafted; mine:false stamped by DRAFT_PLAYER)');
      assertEq(next.marks.z, { drafted: false, target: false, avoid: false, mine: false }, 'new player z gets all-false marks, including mine:false');
      assertEq(next.undoStack.map(function (e) { return e.playerId; }), ['c'], 'a dropped (gone), c kept (still exists), order preserved');
      assertEq(next.filters, { position: 'ALL', status: 'AVAILABLE' });
      assertEq(next.searchText, '');
    });

    t('unknown action type -> state unchanged (same reference)', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'NOT_A_REAL_ACTION' });
      assert(next === state, 'expected same reference for unknown action type');
    });

    t('createStore: dispatch updates state and notifies subscribers only on change', function () {
      localStorage.removeItem(DC.state.STORAGE_KEY);
      var store = DC.state.createStore(makeBaseState());
      var notifyCount = 0;
      var lastState = null;
      var unsubscribe = store.subscribe(function (s) {
        notifyCount++;
        lastState = s;
      });

      store.dispatch({ type: 'DRAFT_PLAYER', playerId: 'a' });
      assertEq(notifyCount, 1, 'should notify on state change');
      assertEq(lastState.marks.a.drafted, true);
      assertEq(store.getState().marks.a.drafted, true);

      store.dispatch({ type: 'DRAFT_PLAYER', playerId: 'a' });
      assertEq(notifyCount, 1, 'should not notify when reducer returns unchanged state');

      unsubscribe();
      store.dispatch({ type: 'UNDO_DRAFT' });
      assertEq(notifyCount, 1, 'should not notify after unsubscribe');

      var savedRaw = localStorage.getItem(DC.state.STORAGE_KEY);
      assert(savedRaw !== null, 'store should have persisted state to localStorage on change');
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('createSeedState: includes manuallyEdited:false', function () {
      var s = DC.state.createSeedState();
      assertEq(s.manuallyEdited, false);
    });

    t('REORDER_PLAYERS: valid full permutation renumbers rank 1..N in new order, sets manuallyEdited true', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'c', 'a', 'd', 'b'] });
      assertEq(next.players.map(function (p) { return p.id; }), ['e', 'c', 'a', 'd', 'b']);
      assertEq(next.players.map(function (p) { return p.rank; }), [1, 2, 3, 4, 5]);
      assertEq(next.manuallyEdited, true);
    });

    t('REORDER_PLAYERS: marks and undoStack are the same reference as before (===)', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'd', 'c', 'b', 'a'] });
      assert(next.marks === state.marks, 'marks should be same reference');
      assert(next.undoStack === state.undoStack, 'undoStack should be same reference');
    });

    t('REORDER_PLAYERS: wrong-length order -> same state reference', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['a', 'b', 'c', 'd'] });
      assert(next === state, 'expected same reference for wrong-length order');
    });

    t('REORDER_PLAYERS: duplicate id -> same state reference', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['a', 'b', 'c', 'd', 'a'] });
      assert(next === state, 'expected same reference for duplicate id');
    });

    t('REORDER_PLAYERS: unknown id -> same state reference', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['a', 'b', 'c', 'd', 'zzz'] });
      assert(next === state, 'expected same reference for unknown id');
    });

    t('REORDER_PLAYERS: identical order still commits a fresh object and sets manuallyEdited true', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['a', 'b', 'c', 'd', 'e'] });
      assert(next !== state, 'expected a new state object even for a no-op order');
      assertEq(next.manuallyEdited, true);
      assertEq(next.players.map(function (p) { return p.id; }), ['a', 'b', 'c', 'd', 'e']);
    });

    t('REORDER_PLAYERS: a drafted player moved to a new rank keeps drafted mark and pickNumber', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'c' });
      assertEq(DC.state.pickNumber(state, 'c'), 2);
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'd', 'c', 'b', 'a'] });
      var movedC = next.players.filter(function (p) { return p.id === 'c'; })[0];
      assertEq(movedC.rank, 3, 'c moved to rank 3');
      assertEq(next.marks.c.drafted, true, 'drafted mark preserved through reorder');
      assertEq(DC.state.pickNumber(next, 'c'), 2, 'pick number unaffected by reorder');
    });

    t('IMPORT_PLAYERS clears manuallyEdited to false', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'd', 'c', 'b', 'a'] });
      assertEq(state.manuallyEdited, true, 'precondition: manuallyEdited set by reorder');
      var newPlayers = [
        { id: 'b', rank: 1, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'z', rank: 2, name: 'Zeke New', team: 'NYG', position: 'RB', byeWeek: 12 }
      ];
      var next = DC.state.reduce(state, { type: 'IMPORT_PLAYERS', players: newPlayers });
      assertEq(next.manuallyEdited, false);
    });
  })();

  <!-- Task 3: selectors tests -->
  <script>
  (function () {
    'use strict';
    section('selectors');

    function makePlayers() {
      return [
        { id: 'p1', rank: 1, name: 'Aaron Ace', team: 'KC', position: 'QB', byeWeek: 9 },
        { id: 'p2', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'p3', rank: 3, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10 },
        { id: 'p4', rank: 4, name: 'Dave Deep', team: 'KC', position: 'TE', byeWeek: 9 },
        { id: 'p5', rank: 5, name: 'Erik End', team: 'SEA', position: 'RB', byeWeek: 13 },
        { id: 'p6', rank: 6, name: 'Frank Flat', team: 'NYG', position: 'WR', byeWeek: 12 },
        { id: 'p7', rank: 7, name: 'Greg Gunslinger', team: 'BUF', position: 'QB', byeWeek: 5 },
        { id: 'p8', rank: 8, name: 'Hank Hustle', team: 'ARI', position: 'RB', byeWeek: 5 }
      ];
    }

    function makeMarks(players) {
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false };
      });
      return marks;
    }

    function makeState(overrides) {
      var players = makePlayers();
      var state = {
        schemaVersion: 1,
        players: players,
        marks: makeMarks(players),
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: ''
      };
      if (overrides && overrides.marks) {
        Object.keys(overrides.marks).forEach(function (id) {
          state.marks[id] = Object.assign({}, state.marks[id], overrides.marks[id]);
        });
      }
      if (overrides && overrides.filters) {
        state.filters = Object.assign({}, state.filters, overrides.filters);
      }
      if (overrides && overrides.searchText !== undefined) {
        state.searchText = overrides.searchText;
      }
      return state;
    }

    function assertAscendingRanks(list) {
      for (var i = 1; i < list.length; i++) {
        assert(list[i - 1].rank < list[i].rank, 'ranks not strictly ascending at index ' + i);
      }
    }

    t('visiblePlayers default filters hide drafted, preserve rank order', function () {
      var state = makeState({ marks: { p3: { drafted: true }, p7: { drafted: true } } });
      var visible = DC.state.visiblePlayers(state);
      assertEq(visible.map(function (p) { return p.id; }), ['p1', 'p2', 'p4', 'p5', 'p6', 'p8']);
      assertAscendingRanks(visible);
      assertEq(visible[0].drafted, false);
    });

    t('visiblePlayers RB + TARGETS combo returns only targeted, undrafted RBs in rank order', function () {
      var state = makeState({
        filters: { position: 'RB', status: 'TARGETS' },
        marks: {
          p2: { target: true },
          p5: { target: true },
          p6: { target: true }, // WR, excluded by position filter
          p8: { avoid: true }   // RB but not targeted, excluded by status filter
        }
      });
      var visible = DC.state.visiblePlayers(state);
      assertEq(visible.map(function (p) { return p.id; }), ['p2', 'p5']);
      assertAscendingRanks(visible);
    });

    t('visiblePlayers FLEX filter: returns exactly the RB/WR/TE union (never QB — FLEX is a filter, not a player position), in rank order, respecting status as usual', function () {
      var state = makeState({
        filters: { position: 'FLEX', status: 'AVAILABLE' },
        marks: { p5: { drafted: true } } // RB p5 drafted -> excluded under AVAILABLE
      });
      var visible = DC.state.visiblePlayers(state);
      assertEq(visible.map(function (p) { return p.id; }), ['p2', 'p3', 'p4', 'p6', 'p8'], 'RB/WR/TE union, QB excluded, drafted p5 excluded, rank order preserved');
      assertAscendingRanks(visible);
    });

    t('visiblePlayers DRAFTED status view returns drafted players regardless of position ALL', function () {
      var state = makeState({
        filters: { position: 'ALL', status: 'DRAFTED' },
        marks: { p3: { drafted: true }, p7: { drafted: true } }
      });
      var visible = DC.state.visiblePlayers(state);
      assertEq(visible.map(function (p) { return p.id; }), ['p3', 'p7']);
      visible.forEach(function (p) { assertEq(p.drafted, true); });
    });

    t('visiblePlayers: drafted player hidden under AVAILABLE, but visible when searching its own name', function () {
      var state = makeState({ marks: { p1: { drafted: true } } });
      var underAvailable = DC.state.visiblePlayers(state);
      assert(underAvailable.indexOf === undefined || underAvailable.filter(function (p) { return p.id === 'p1'; }).length === 0, 'p1 should be hidden under AVAILABLE');

      var searching = Object.assign({}, state, { searchText: 'Aaron' });
      var found = DC.state.visiblePlayers(searching).filter(function (p) { return p.id === 'p1'; });
      assertEq(found.length, 1, 'p1 should be found by search despite being drafted');
      assertEq(found[0].drafted, true);
    });

    t('visiblePlayers view objects carry merged mark fields', function () {
      var state = makeState({ marks: { p2: { target: true } } });
      var visible = DC.state.visiblePlayers(state);
      var p2 = visible.filter(function (p) { return p.id === 'p2'; })[0];
      assertEq(p2.name, 'Bobby Back');
      assertEq(p2.target, true);
      assertEq(p2.drafted, false);
      assertEq(p2.avoid, false);
    });

    t('availableCountsByPosition ignores status filter and searchText', function () {
      var state = makeState({
        filters: { position: 'RB', status: 'DRAFTED' },
        searchText: 'xyz',
        marks: { p3: { drafted: true } }
      });
      var counts = DC.state.availableCountsByPosition(state);
      assertEq(counts, { QB: 2, RB: 3, WR: 1, TE: 1, DST: 0, K: 0 });

      var stateDifferentFilters = makeState({
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: '',
        marks: { p3: { drafted: true } }
      });
      var counts2 = DC.state.availableCountsByPosition(stateDifferentFilters);
      assertEq(counts2, counts, 'counts should be independent of filters/searchText');
    });

    t('pickNumber returns 1-based index in undoStack, or null if absent', function () {
      var state = makeState({});
      state.undoStack = [
        { playerId: 'p2', timestamp: 111 },
        { playerId: 'p5', timestamp: 222 }
      ];
      assertEq(DC.state.pickNumber(state, 'p2'), 1);
      assertEq(DC.state.pickNumber(state, 'p5'), 2);
      assertEq(DC.state.pickNumber(state, 'p1'), null);
    });
  })();
  </script>

  <script>
  (function () {
    'use strict';
    section('persistence');

    function makeHealPlayers() {

    });

    t('load(): missing key falls back to a fresh seed state', function () {
      localStorage.removeItem(DC.state.STORAGE_KEY);
      var loaded = DC.state.load();
      assertEq(loaded, DC.state.createSeedState());
    });

    t('load(): corrupt JSON falls back to seed', function () {
      localStorage.setItem(DC.state.STORAGE_KEY, '{not valid json');
      var loaded = DC.state.load();
      assertEq(loaded, DC.state.createSeedState());
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('load(): structurally-wrong shape falls back to seed', function () {
      localStorage.setItem(DC.state.STORAGE_KEY, JSON.stringify({ schemaVersion: 1 }));
      var loaded = DC.state.load();
      assertEq(loaded, DC.state.createSeedState());
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('load(): future schemaVersion falls back to seed', function () {
      var future = DC.state.createSeedState();
      future.schemaVersion = DC.state.CURRENT_SCHEMA_VERSION + 1;
      localStorage.setItem(DC.state.STORAGE_KEY, JSON.stringify(future));
      var loaded = DC.state.load();
      assertEq(loaded, DC.state.createSeedState());
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('save()/load() round trip preserves a non-trivial state exactly', function () {
      localStorage.removeItem(DC.state.STORAGE_KEY);
      var state = DC.state.createSeedState();
      var firstId = state.players[0].id;
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: firstId });
      state = DC.state.reduce(state, { type: 'SET_POSITION_FILTER', position: 'RB' });

      DC.state.save(state);
      var loaded = DC.state.load();
      assertEq(loaded, state);
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('save()/load() round trip preserves the FLEX position filter exactly (FLEX survives isValidState and is never rejected/healed away)', function () {
      localStorage.removeItem(DC.state.STORAGE_KEY);
      var state = DC.state.createSeedState();
      state = DC.state.reduce(state, { type: 'SET_POSITION_FILTER', position: 'FLEX' });
      assertEq(state.filters.position, 'FLEX');

      DC.state.save(state);
      var loaded = DC.state.load();
      assertEq(loaded, state);
      assertEq(loaded.filters.position, 'FLEX');
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('save(): swallows localStorage errors (quota/privacy) without throwing', function () {
      var orig = localStorage.setItem;
      localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
      try {
        DC.state.save(DC.state.createSeedState());
        assert(true, 'save() should not throw even if setItem throws');
      } finally {
        localStorage.setItem = orig;
      }
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('load(): heals empty marks object instead of crashing selectors', function () {

        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },

      };
      localStorage.setItem(DC.state.STORAGE_KEY, JSON.stringify(payload));
      var loaded = DC.state.load();
      assertEq(loaded.marks.x1, { drafted: false, target: false, avoid: false, mine: false });
      assertEq(loaded.marks.x2, { drafted: false, target: false, avoid: false, mine: false });
      DC.state.visiblePlayers(loaded);
      DC.state.availableCountsByPosition(loaded);
      assert(true, 'visiblePlayers/availableCountsByPosition ran without throwing');
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    t('load(): heals a mark entry with a wrong-typed field, preserving valid booleans', function () {

        schemaVersion: 1,
        players: makeHealPlayers(),

          x1: { drafted: 'yes', target: true, avoid: false },
          x2: { drafted: false, target: false, avoid: false }
        },
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: ''

      localStorage.removeItem(DC.state.STORAGE_KEY);

      var order = state.players.map(function (p) { return p.id; });
      var tmp = order[0];

      state = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: order });
      assertEq(state.manuallyEdited, true, 'precondition: manuallyEdited set by reorder');

      var text = JSON.stringify(state);
      var parsed = DC.importer.parseBackup(text);
      assertEq(parsed.ok, true, 'expected parseBackup ok:true — ' + (parsed.error || ''));

      var check = DC.ui.templates.backupApplyCheck(parsed.state);
      assertEq(check.ok, true, 'expected backupApplyCheck ok:true — ' + (check.error || ''));

      DC.state.save(parsed.state);
      var loaded = DC.state.load();

      // per-field/per-player comparisons (not a single top-level assertEq) because REORDER_PLAYERS
      // changes players' order without touching marks' key-insertion order, while load()'s

      // which the harness's JSON.stringify-based deepEqual would otherwise flag as unequal.
      assertEq(loaded.schemaVersion, state.schemaVersion);
      assertEq(loaded.manuallyEdited, true, 'manuallyEdited survives the full apply-backup pipeline');
      assertEq(loaded.filters, state.filters);
      assertEq(loaded.searchText, state.searchText);

    });

      // this is exactly what applyBackup() does on ok: save the raw (unmigrated) backup

      localStorage.setItem(DC.state.STORAGE_KEY, JSON.stringify(v1Payload));

      assertEq(loaded.undoStack, v1Payload.undoStack, 'undoStack preserved exactly');
      localStorage.removeItem(DC.state.STORAGE_KEY);
    });

    // ---- Round 8 Task 2: schema v5 — adp field healing ----

    t('load(): healAdp matrix — valid object heals with canonical key order regardless of input order; array/string/partial/NaN-member/zero/negative/missing all heal to null', function () {

      var invalidCases = [

        { espn: 1, yahoo: 2 },

      ];
      invalidCases.forEach(function (bad, i) {

    t('load(): migrations[4] is a pure pass-through — a v4 payload migrates to schemaVersion 5 with players content preserved and adp healed null on', function () {
      var payload = {

  <!-- Round 3 Task 1: schema v3 - mine flag, TOGGLE_MINE, persist-after-migration -->
  <script>
  (function () {
    'use strict';
    section('state');

    function makeMinePlayers() {
      return [
        { id: 'm1', rank: 1, name: 'Milo One', team: 'KC', position: 'QB', byeWeek: 9 },

      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false, mine: false };
      });
      return marks;
    }

    function makeMineState() {

      return {
        schemaVersion: 3,
        players: players,
        marks: makeMineMarks(players),

      var next = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'm1' });
      assertEq(next.marks.m1, { drafted: true, target: false, avoid: false, mine: false });
    });

    t('TOGGLE_MINE flips mine when the player is drafted', function () {

      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'm1', mine: true });
      var toggled = DC.state.reduce(state, { type: 'TOGGLE_MINE', playerId: 'm1' });
      assertEq(toggled.marks.m1, { drafted: true, target: false, avoid: false, mine: false });
      var toggledAgain = DC.state.reduce(toggled, { type: 'TOGGLE_MINE', playerId: 'm1' });

    t('TOGGLE_MINE on an undrafted player -> unchanged (same reference)', function () {

      assertEq(next.marks.m2, { drafted: false, target: false, avoid: false, mine: false });
    });

      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'm1', mine: true });

      assertEq(next.marks.m1, { drafted: false, target: false, avoid: false, mine: false });
      assertEq(next.marks.m2.target, true, 'target should survive RESET_DRAFT');

    });

    t('IMPORT_PLAYERS: a brand-new player id gets the full 4-key mark default, including mine:false', function () {
      var state = makeMineState();

        { id: 's5', rank: 5, name: 'Sam Five', team: 'SEA', position: 'RB', byeWeek: 13 }
      ];
    }

    function makeMineSelectorState(overrides) {
      var players = makeMineSelectorPlayers();
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false, mine: false };
      });
      var state = {
        schemaVersion: 3,
        players: players,
        marks: marks,
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: '',
        manuallyEdited: false
      };
      if (overrides && overrides.marks) {
        Object.keys(overrides.marks).forEach(function (id) {
          state.marks[id] = Object.assign({}, state.marks[id], overrides.marks[id]);
        });
      }
      if (overrides && overrides.filters) {
        state.filters = Object.assign({}, state.filters, overrides.filters);
      }
      return state;
    }

    t('visiblePlayers MINE status shows only drafted&&mine players, in rank order', function () {
      var state = makeMineSelectorState({
        filters: { status: 'MINE' },
        marks: {
          s2: { drafted: true, mine: true },
          s4: { drafted: true, mine: false }, // drafted by someone else, not mine
          s5: { drafted: true, mine: true }
        }
      });
      var visible = DC.state.visiblePlayers(state);
      assertEq(visible.map(function (p) { return p.id; }), ['s2', 's5']);
    });

    t('myRosterCounts counts drafted&&mine by position, independent of filters/searchText', function () {
      var state = makeMineSelectorState({
        marks: {
          s2: { drafted: true, mine: true },  // RB
          s4: { drafted: true, mine: false }, // TE, not mine
          s5: { drafted: true, mine: true }   // RB
        }

      assertEq(nonNumber.ok, false, 'string-typed schemaVersion should be rejected, not coerced');
      assertEq(nonNumber.error, 'This backup is from a different app version.');
    });

    // --- final review: unmigratable numeric schemaVersion values must be rejected too ---
    t('backupApplyCheck: schemaVersion 0 is rejected (no schema that old exists) with the unchanged error string', function () {
      var result = DC.ui.templates.backupApplyCheck({ schemaVersion: 0, players: [{}] });
      assertEq(result.ok, false, 'schemaVersion 0 should be rejected');
      assertEq(result.error, 'This backup is from a different app version.');
    });

    t('backupApplyCheck: non-integer schemaVersion (1.5) is rejected with the unchanged error string', function () {
      var result = DC.ui.templates.backupApplyCheck({ schemaVersion: 1.5, players: [{}] });
      assertEq(result.ok, false, 'schemaVersion 1.5 should be rejected');
      assertEq(result.error, 'This backup is from a different app version.');
    });

    // --- fix: two-tap confirm arm state must not survive a sheet close, and arming one
    // button must disarm any other pending confirm (mounts DC.ui into a hidden, throwaway
    // DOM fixture — no other way to exercise this DOM-wired logic) ---

    function buildMountFixture() {
      var root = document.createElement('div');
      root.style.display = 'none';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +
            '<div id="search-container"></div>' +
            '<div id="tracker-strip"></div>' +
            '<div id="filter-chips"></div>' +
            '<div id="summary-line"></div>' +
          '</header>' +
          '<main id="player-list"></main>' +
          '<div id="undo-banner-root"></div>' +
          '<nav id="bottom-bar"></nav>' +
          '<div id="sheet-root"></div>' +
        '</div>';
      document.body.appendChild(root);
      return root;
    }

    t('two-tap confirm: closing the sheet disarms a pending confirm; arming one button disarms another', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);

        var openBtn = fixture.querySelector('[data-action="open-settings"]');
        var doneBtn = fixture.querySelector('[data-action="close-settings"]');
        var clearAllBtn = fixture.querySelector('[data-action="clear-all-data"]');
        var resetDraftBtn = fixture.querySelector('[data-action="reset-draft"]');
        assert(openBtn && doneBtn && clearAllBtn && resetDraftBtn, 'expected sheet buttons to exist after mount');

        openBtn.click();
        clearAllBtn.click(); // first tap: arm
        assertEq(clearAllBtn.getAttribute('data-armed'), '1', 'clear-all-data armed after first tap');
        assertEq(clearAllBtn.textContent, 'Tap again to confirm', 'clear-all-data label shows confirm prompt');

        resetDraftBtn.click(); // arming a different button must disarm clear-all-data
        assertEq(resetDraftBtn.getAttribute('data-armed'), '1', 'reset-draft armed after its first tap');
        assert(clearAllBtn.getAttribute('data-armed') !== '1', 'clear-all-data disarmed once a different button arms');
        assertEq(clearAllBtn.textContent, 'Clear All Data', 'clear-all-data label restored once disarmed');

        doneBtn.click(); // close the sheet while reset-draft is still armed
        openBtn.click(); // reopen
        assert(resetDraftBtn.getAttribute('data-armed') !== '1', 'reset-draft disarmed by the sheet close, not still armed on reopen');
        assertEq(resetDraftBtn.textContent, 'Reset Draft', 'reset-draft label restored after close+reopen');

        // single taps only ever arm — no destructive action should have actually fired
        var state = store.getState();
        var anyDrafted = state.players.some(function (p) { return state.marks[p.id].drafted; });
        assert(!anyDrafted, 'no player should be drafted: only arming taps were simulated, never a confirming second tap');
      } finally {
        document.body.removeChild(fixture);
      }
    });

    // --- Task 5: entry point + import auto-backup interlock ---

    var TASK5_RANKINGS_TEXT = [
      '1. Aaron Ace KC QB',
      '2. Bobby Back DAL RB',
      '3. Cody Catch MIA WR',
      '4. Dave Deep SEA TE',
      '5. Erik End BUF QB'
    ].join('\n');

    t('shouldAutoBackupBeforeImport: false for seed; true after REORDER_PLAYERS; false again after IMPORT_PLAYERS', function () {
      var seed = DC.state.createSeedState();
      assertEq(DC.ui.templates.shouldAutoBackupBeforeImport(seed), false, 'seed state should not require a backup');

      var order = seed.players.slice().reverse().map(function (p) { return p.id; });
      var reordered = DC.state.reduce(seed, { type: 'REORDER_PLAYERS', order: order });
      assertEq(DC.ui.templates.shouldAutoBackupBeforeImport(reordered), true, 'a manual reorder should require a backup before the next import');

      var imported = DC.state.reduce(reordered, { type: 'IMPORT_PLAYERS', players: reordered.players });
      assertEq(DC.ui.templates.shouldAutoBackupBeforeImport(imported), false, 'a fresh import clears manuallyEdited, so no backup should be required right after');
    });

    t('sheet: Edit Rankings row sits above Import Rankings, closes the sheet, and calls DC.edit.open', function () {
      var fixture = buildMountFixture();
      var realEdit = window.DC.edit;
      var opened = false;
      window.DC.edit = { open: function () { opened = true; } };
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);

        var sheetEl = fixture.querySelector('.sheet');
        var editBtn = sheetEl.querySelector('[data-action="edit-rankings"]');
        var importBtn = sheetEl.querySelector('[data-action="toggle-import"]');
        assert(editBtn && importBtn, 'expected both the edit-rankings and toggle-import rows to exist');

        var rows = Array.prototype.slice.call(sheetEl.children);
        assert(rows.indexOf(editBtn) < rows.indexOf(importBtn), 'edit-rankings row should be positioned above Import Rankings');

        fixture.querySelector('[data-action="open-settings"]').click();
        editBtn.click();

        assert(opened, 'DC.edit.open should have been called');
        assertEq(sheetEl.hidden, true, 'sheet should be hidden after tapping edit-rankings');
      } finally {
        window.DC.edit = realEdit;
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

    t('sheet: ADP freshness note renders the stubbed updatedAt as a short date near the import area; omitted entirely when DC.adpData is absent', function () {
      var real = window.DC.adpData;
      function adpNoteIn(fixture) {
        var notes = Array.prototype.slice.call(fixture.querySelectorAll('.sheet-note'));
        return notes.filter(function (n) { return n.textContent.indexOf('ADP updated') === 0; })[0];
      }
      try {
        window.DC.adpData = { updatedAt: '2026-03-07', players: {} };
        var fixture = buildMountFixture();
        try {
          DC.ui.mount(DC.state.createStore(DC.state.createSeedState()));
          fixture.querySelector('[data-action="open-settings"]').click();
          var note = adpNoteIn(fixture);
          assert(note, 'expected an ADP freshness sheet-note when DC.adpData is present');
          assertEq(note.textContent, 'ADP updated Mar 7', 'short human date, no leading zero on the day');
        } finally {
          document.body.removeChild(fixture);
          localStorage.removeItem(DC.state.STORAGE_KEY);
        }

        window.DC.adpData = undefined;
        var fixture2 = buildMountFixture();
        try {
          DC.ui.mount(DC.state.createStore(DC.state.createSeedState()));
          fixture2.querySelector('[data-action="open-settings"]').click();
          assertEq(adpNoteIn(fixture2), undefined, 'ADP freshness note should be omitted entirely when DC.adpData is absent');
        } finally {
          document.body.removeChild(fixture2);
          localStorage.removeItem(DC.state.STORAGE_KEY);
        }
      } finally {
        window.DC.adpData = real;
      }
    });

    t('applyRankings: manuallyEdited true auto-backs-up (createObjectURL) BEFORE the single IMPORT_PLAYERS dispatch', function () {
      var fixture = buildMountFixture();
      var seed = DC.state.createSeedState();
      var store = DC.state.createStore(Object.assign({}, seed, { manuallyEdited: true }));

      var seq = 0;
      var createCalls = [];
      var dispatchCalls = [];
      var originalCreateObjectURL = URL.createObjectURL;
      var originalDispatch = store.dispatch;

      URL.createObjectURL = function (blob) {
        createCalls.push({ seq: seq++, blob: blob });
        return 'blob:test-stub';
      };
      store.dispatch = function (action) {
        dispatchCalls.push({ seq: seq++, action: action });
        return originalDispatch(action);
      };

      try {
        DC.ui.mount(store);

        fixture.querySelector('[data-action="open-settings"]').click();
        fixture.querySelector('[data-action="toggle-import"]').click();
        fixture.querySelector('.import-textarea').value = TASK5_RANKINGS_TEXT;
        fixture.querySelector('[data-action="import-parse"]').click();

        var applyBtn = fixture.querySelector('[data-action="import-apply-rankings"]');
        assert(applyBtn, 'import-apply-rankings button should render after a successful rankings parse');
        applyBtn.click(); // first tap: arm
        applyBtn.click(); // second tap: confirm -> applyRankings()

        var importDispatches = dispatchCalls.filter(function (d) { return d.action.type === 'IMPORT_PLAYERS'; });
        assertEq(importDispatches.length, 1, 'expected exactly one IMPORT_PLAYERS dispatch');
        assertEq(createCalls.length, 1, 'expected exactly one createObjectURL (backup) call when manuallyEdited is true');
        assert(createCalls[0].seq < importDispatches[0].seq, 'backup export must run before the IMPORT_PLAYERS dispatch');
        // Blob content is intentionally NOT asserted here: Blob#text() is async and reading it
        // would require the test itself to go async; call-order + call-count is sufficient to
        // prove the ordering invariant synchronously, per the Task 5 spec.
      } finally {
        URL.createObjectURL = originalCreateObjectURL;
        store.dispatch = originalDispatch;
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

    t('applyRankings: manuallyEdited false skips the auto-backup — no createObjectURL call, import still proceeds', function () {
      var fixture = buildMountFixture();
      var seed = DC.state.createSeedState();
      var store = DC.state.createStore(Object.assign({}, seed, { manuallyEdited: false }));

      var createCalls = [];
      var dispatchCalls = [];
      var originalCreateObjectURL = URL.createObjectURL;
      var originalDispatch = store.dispatch;

      URL.createObjectURL = function (blob) {
        createCalls.push(blob);
        return 'blob:test-stub';
      };
      store.dispatch = function (action) {
        dispatchCalls.push(action);
        return originalDispatch(action);
      };

      try {
        DC.ui.mount(store);

        fixture.querySelector('[data-action="open-settings"]').click();
        fixture.querySelector('[data-action="toggle-import"]').click();
        fixture.querySelector('.import-textarea').value = TASK5_RANKINGS_TEXT;
        fixture.querySelector('[data-action="import-parse"]').click();

        var applyBtn = fixture.querySelector('[data-action="import-apply-rankings"]');
        applyBtn.click(); // arm
        applyBtn.click(); // confirm

        var importDispatches = dispatchCalls.filter(function (a) { return a.type === 'IMPORT_PLAYERS'; });
        assertEq(importDispatches.length, 1, 'import should still proceed with exactly one dispatch');
        assertEq(createCalls.length, 0, 'no backup should be created when manuallyEdited is false');
      } finally {
        URL.createObjectURL = originalCreateObjectURL;
        store.dispatch = originalDispatch;
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

    t('renderImportPreview: manuallyEdited true prepends the auto-backup note to the rankings preview; false does not', function () {
      function previewTextFor(manuallyEdited) {
        var fixture = buildMountFixture();
        try {
          var seed = DC.state.createSeedState();
          var store = DC.state.createStore(Object.assign({}, seed, { manuallyEdited: manuallyEdited }));
          DC.ui.mount(store);

          fixture.querySelector('[data-action="open-settings"]').click();
          fixture.querySelector('[data-action="toggle-import"]').click();
          fixture.querySelector('.import-textarea').value = TASK5_RANKINGS_TEXT;
          fixture.querySelector('[data-action="import-parse"]').click();

          return fixture.querySelector('.import-preview').textContent;
        } finally {
          document.body.removeChild(fixture);
          localStorage.removeItem(DC.state.STORAGE_KEY);
        }
      }

      var withEdit = previewTextFor(true);
      assert(withEdit.indexOf('backup will download automatically') !== -1, 'manuallyEdited true should show the auto-backup note: ' + withEdit);

      var withoutEdit = previewTextFor(false);
      assert(withoutEdit.indexOf('backup will download automatically') === -1, 'manuallyEdited false should not show the auto-backup note: ' + withoutEdit);
    });
  })();
  </script>

  <!-- Task 3: edit.js pure staging + geometry + template tests -->
  <script>
  (function () {
    'use strict';
    section('reorder');

    function makeStaged() {
      return [
        { id: 'a', rank: 1, name: 'Aaron Ace', team: 'KC', position: 'QB', byeWeek: 9 },
        { id: 'b', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'c', rank: 3, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10 },
        { id: 'd', rank: 4, name: 'Dave Deep', team: 'KC', position: 'TE', byeWeek: 9 },
        { id: 'e', rank: 5, name: 'Erik End', team: 'SEA', position: 'RB', byeWeek: 13 }
      ];
    }

    // ---- staging ----

    t('fromPlayers: fresh copies, same ids/order, but different object references', function () {
      var players = makeStaged();
      var staged = DC.edit.staging.fromPlayers(players);
      assertEq(DC.edit.staging.idsOf(staged), ['a', 'b', 'c', 'd', 'e']);
      staged.forEach(function (p, i) {
        assert(p !== players[i], 'expected a shallow copy, not the same reference, at index ' + i);
        assertEq(p, players[i], 'copy should be deep-equal to original at index ' + i);
      });
    });

    t('moveByIndex: forward move shifts the item and closes the gap', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 0, 3);
      assertEq(DC.edit.staging.idsOf(next), ['b', 'c', 'd', 'a', 'e']);
    });

    t('moveByIndex: backward move shifts the item back', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 3, 0);
      assertEq(DC.edit.staging.idsOf(next), ['d', 'a', 'b', 'c', 'e']);
    });

    t('moveByIndex: fromIndex === toIndex -> same reference', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 2, 2);
      assert(next === staged, 'expected same reference when fromIndex === toIndex');
    });

    t('moveByIndex: out-of-range fromIndex -> same reference', function () {
      var staged = makeStaged();
      assert(DC.edit.staging.moveByIndex(staged, -1, 2) === staged, 'negative fromIndex');
      assert(DC.edit.staging.moveByIndex(staged, 5, 2) === staged, 'fromIndex === length');
      assert(DC.edit.staging.moveByIndex(staged, 99, 2) === staged, 'fromIndex way out of range');
    });

    t('moveByIndex: toIndex clamps into [0, length-1]', function () {
      var staged = makeStaged();
      var overshootHigh = DC.edit.staging.moveByIndex(staged, 0, 999);
      assertEq(DC.edit.staging.idsOf(overshootHigh), ['b', 'c', 'd', 'e', 'a'], 'clamped to last index');
      var overshootLow = DC.edit.staging.moveByIndex(staged, 4, -999);
      assertEq(DC.edit.staging.idsOf(overshootLow), ['e', 'a', 'b', 'c', 'd'], 'clamped to first index');
    });

    // --- pin: clamped-no-op same-reference contract (official per amended spec supplement) ---
    // moveByIndex's same-ref check compares the CLAMPED toIndex to fromIndex, not the raw
    // toIndex — so an overshoot/undershoot that clamps back onto fromIndex is a same-reference
    // no-op, while an overshoot that clamps onto a genuinely different index still moves.

    t('moveByIndex: overshoot past the end from the already-last row -> same reference (clamped toIndex === fromIndex)', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 4, 999);
      assert(next === staged, 'expected same reference: item already at last index, overshoot clamps back to itself');
    });

    t('moveByIndex: undershoot below the start from the already-first row -> same reference (clamped toIndex === fromIndex)', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 0, -999);
      assert(next === staged, 'expected same reference: item already at first index, undershoot clamps back to itself');
    });

    t('moveByIndex: a non-no-op overshoot still moves — new array reference, item ends up last', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveByIndex(staged, 0, 999);
      assert(next !== staged, 'expected a NEW array reference: fromIndex 0 is not already at the clamped destination (last index)');
      assertEq(DC.edit.staging.idsOf(next), ['b', 'c', 'd', 'e', 'a']);
    });

    t('moveToRank: normal move, clamp-low (toRank 0), clamp-high (toRank beyond length)', function () {
      var staged = makeStaged();
      var normal = DC.edit.staging.moveToRank(staged, 'a', 3);
      assertEq(DC.edit.staging.idsOf(normal), ['b', 'c', 'a', 'd', 'e'], 'rank 3 -> index 2');

      var clampLow = DC.edit.staging.moveToRank(staged, 'e', 0);
      assertEq(DC.edit.staging.idsOf(clampLow), ['e', 'a', 'b', 'c', 'd'], 'toRank 0 clamps to rank 1 -> index 0');

      var clampHigh = DC.edit.staging.moveToRank(staged, 'a', 999);
      assertEq(DC.edit.staging.idsOf(clampHigh), ['b', 'c', 'd', 'e', 'a'], 'toRank overshoot clamps to last rank');
    });

    t('moveToRank: unknown id -> same reference', function () {
      var staged = makeStaged();
      var next = DC.edit.staging.moveToRank(staged, 'zzz', 2);
      assert(next === staged, 'expected same reference for unknown id');
    });

    t('idsOf: maps players to their ids in order', function () {
      assertEq(DC.edit.staging.idsOf(makeStaged()), ['a', 'b', 'c', 'd', 'e']);
    });

    t('stagedOrderChanged: false on identical order (different array references), true on swap, true on length mismatch', function () {
      var committed = makeStaged();
      var identicalCopy = DC.edit.staging.fromPlayers(committed);
      assert(identicalCopy !== committed, 'precondition: fromPlayers returns a different reference');
      assertEq(DC.edit.staging.stagedOrderChanged(identicalCopy, committed), false);

      var swapped = DC.edit.staging.moveByIndex(identicalCopy, 1, 2);
      assertEq(DC.edit.staging.stagedOrderChanged(swapped, committed), true);

      var shorter = committed.slice(0, 4);
      assertEq(DC.edit.staging.stagedOrderChanged(shorter, committed), true, 'length mismatch should be true');
    });

    t('diffMovedIds: identical order -> empty array', function () {
      var original = DC.edit.staging.idsOf(makeStaged());
      var staged = DC.edit.staging.fromPlayers(makeStaged());
      assertEq(DC.edit.staging.diffMovedIds(original, staged), []);
    });

    t('diffMovedIds: adjacent swap -> exactly those 2 ids', function () {
      var staged = makeStaged();
      var original = DC.edit.staging.idsOf(staged);
      var swapped = DC.edit.staging.moveByIndex(staged, 1, 2);
      assertEq(DC.edit.staging.diffMovedIds(original, swapped).sort(), ['b', 'c']);
    });

    t('diffMovedIds: a shift across the whole range reports every displaced id', function () {
      var staged = makeStaged();
      var original = DC.edit.staging.idsOf(staged);
      var shifted = DC.edit.staging.moveByIndex(staged, 0, 2); // a moves past b,c
      assertEq(DC.edit.staging.idsOf(shifted), ['b', 'c', 'a', 'd', 'e']);
      assertEq(DC.edit.staging.diffMovedIds(original, shifted).sort(), ['a', 'b', 'c']);
    });

    // ---- geometry ----

    t('dropIndexFromPointer: pointer at top -> index 0', function () {
      assertEq(DC.edit.geom.dropIndexFromPointer(0, 0, 40, 10), 0);
    });

    t('dropIndexFromPointer: pointer past bottom with scroll -> count', function () {
      assertEq(DC.edit.geom.dropIndexFromPointer(400, 50, 40, 10), 10);
    });

    t('dropIndexFromPointer: exact half-row midpoint rounds up (JS Math.round behavior)', function () {
      assertEq(DC.edit.geom.dropIndexFromPointer(20, 0, 40, 10), 1, '0.5 rows -> rounds to 1');
      assertEq(DC.edit.geom.dropIndexFromPointer(60, 0, 40, 10), 2, '1.5 rows -> rounds to 2');
    });

    t('dropIndexFromPointer: far negative and far past-bottom pointers clamp to [0, count]', function () {
      assertEq(DC.edit.geom.dropIndexFromPointer(-100000, 0, 40, 10), 0, 'far negative clamps to 0');
      assertEq(DC.edit.geom.dropIndexFromPointer(100000, 0, 40, 10), 10, 'far past-bottom clamps to count');
    });

    t('dropIndexFromPointer: rowStep <= 0 guard returns 0', function () {
      assertEq(DC.edit.geom.dropIndexFromPointer(500, 100, 0, 10), 0, 'rowStep 0');
      assertEq(DC.edit.geom.dropIndexFromPointer(500, 100, -5, 10), 0, 'rowStep negative');
    });

    t('clampRank: parses and clamps valid strings/numbers; rejects unparseable input', function () {
      assertEq(DC.edit.geom.clampRank('17', 252), 17);
      assertEq(DC.edit.geom.clampRank('0', 252), 1, 'clamp-low: 0 -> 1');
      assertEq(DC.edit.geom.clampRank('999', 252), 252, 'clamp-high: 999 -> 252');
      assertEq(DC.edit.geom.clampRank('', 252), null, 'empty string unparseable');
      assertEq(DC.edit.geom.clampRank('abc', 252), null, 'non-numeric unparseable');
      assertEq(DC.edit.geom.clampRank('-3', 252), null, 'negative sign unparseable');
      assertEq(DC.edit.geom.clampRank('3.5', 252), null, 'decimal unparseable');
      assertEq(DC.edit.geom.clampRank(17, 252), 17, 'numeric input parses the same as its string form');
    });

    t('rankJumpTargetIndex: rank 1 -> index 0; rank count -> index count-1; overshoot clamps', function () {
      assertEq(DC.edit.geom.rankJumpTargetIndex(100, 1, 252), 0);
      assertEq(DC.edit.geom.rankJumpTargetIndex(0, 252, 252), 251);
      assertEq(DC.edit.geom.rankJumpTargetIndex(0, 9999, 252), 251, 'overshoot clamps to last index');
      assertEq(DC.edit.geom.rankJumpTargetIndex(0, -5, 252), 0, 'undershoot clamps to first index');
    });

    // ---- templates ----

    function baseEditView(overrides) {
      return Object.assign({
        id: 'ja-marr-chase-cin', rank: 1, name: "Ja'Marr Chase", team: 'CIN', position: 'WR', byeWeek: 10,
        drafted: false, target: false, avoid: false
      }, overrides);
    }

    t('editRowHTML: has a .drag-handle carrying data-id, with no data-action (drag is pointer-driven)', function () {
      var html = DC.edit.templates.editRowHTML(baseEditView(), { moved: false });
      assert(/<div class="drag-handle" data-id="ja-marr-chase-cin"/.test(html), 'drag-handle with data-id: ' + html);
      var handleMatch = html.match(/<div class="drag-handle"[^>]*>/);
      assert(handleMatch, 'drag-handle element found');
      assert(handleMatch[0].indexOf('data-action') === -1, 'drag-handle must not carry data-action: ' + handleMatch[0]);
    });

    t('editRowHTML: .player-rank is tappable with data-action="rank-jump" and matching data-id', function () {
      var html = DC.edit.templates.editRowHTML(baseEditView(), { moved: false });
      assert(/class="player-rank" data-action="rank-jump" data-id="ja-marr-chase-cin"/.test(html), 'rank-jump action present: ' + html);
      assert(html.indexOf('>1<') !== -1, 'rank value 1 shown: ' + html);
    });

    t('editRowHTML: DRAFTED pill + is-drafted-search only render when view.drafted is true', function () {
      var notDrafted = DC.edit.templates.editRowHTML(baseEditView({ drafted: false }), {});
      assert(notDrafted.indexOf('is-drafted-search') === -1, 'no is-drafted-search when not drafted: ' + notDrafted);
      assert(notDrafted.indexOf('drafted-pill') === -1, 'no drafted-pill when not drafted: ' + notDrafted);

      var drafted = DC.edit.templates.editRowHTML(baseEditView({ drafted: true }), {});
      assert(drafted.indexOf('is-drafted-search') !== -1, 'is-drafted-search present when drafted: ' + drafted);
      assert(drafted.indexOf('drafted-pill') !== -1 && drafted.indexOf('DRAFTED') !== -1, 'DRAFTED pill present when drafted: ' + drafted);
    });

    t('editRowHTML: .row-moved only renders when ctx.moved is true', function () {
      var notMoved = DC.edit.templates.editRowHTML(baseEditView(), { moved: false });
      assert(notMoved.indexOf('row-moved') === -1, 'no row-moved when ctx.moved false: ' + notMoved);

        assert(targetRect.height > 0, 'fixture must have real layout (non-zero row height) for this test to be meaningful');

        handle.dispatchEvent(new PointerEvent('pointerdown', {
          bubbles: true, cancelable: true, pointerId: 1, button: 0, clientY: fromRow.getBoundingClientRect().top + 1
        }));
        // move the pointer to the target row's exact top edge -> dropIndexFromPointer rounds to targetIndex precisely
        document.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 1, clientY: targetRect.top }));

        // preview: rows strictly between fromIndex and targetIndex shift up; targetIndex itself must NOT
        // (it is the destination slot finishDrag's toIndex = targetIndex - 1 opens, not a displaced row)
        for (var i = 0; i < rows.length; i++) {
          var shouldShift = i > fromIndex && i < targetIndex;
          assertEq(rows[i].classList.contains('gap-shift'), shouldShift, 'row ' + i + ' gap-shift state during preview');
        }

        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 1 }));

        var idsAfter = Array.prototype.map.call(listEl.querySelectorAll('.player-row'), function (r) { return r.getAttribute('data-id'); });
        var expected = idsBefore.slice();
        var moved = expected.splice(fromIndex, 1)[0];
        expected.splice(targetIndex - 1, 0, moved);
        assertEq(idsAfter, expected, 'committed order must match what the gap preview implied');
      } finally {
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });
  })();

    t('moveToPositionRank: down/beyond-end — RB1 to a rank beyond the group lands immediately after the last RB', function () {
      var staged = makeMixedPositionStaged();
      var next = DC.edit.staging.moveToPositionRank(staged, 'r1', 3);
