    t('moveToPositionRank: clamp-low — a negative/zero posRank clamps to rank 1', function () {
      var staged = makeMixedPositionStaged();
      var next = DC.edit.staging.moveToPositionRank(staged, 'r2', -5);
      assertEq(DC.edit.staging.positionRankOf(next, 'r2'), 1);
      var next2 = DC.edit.staging.moveToPositionRank(staged, 'r2', 0);
      assertEq(DC.edit.staging.positionRankOf(next2, 'r2'), 1);
    });

    t('moveToPositionRank: clamp-high — an overshoot beyond the group clamps to last, same as beyond-end', function () {
      var staged = makeMixedPositionStaged();
      var next = DC.edit.staging.moveToPositionRank(staged, 'r1', 999);
      assertEq(DC.edit.staging.positionRankOf(next, 'r1'), 3);
    });

    t('moveToPositionRank: unknown id -> same reference', function () {
      var staged = makeMixedPositionStaged();
      var next = DC.edit.staging.moveToPositionRank(staged, 'zzz', 2);
      assert(next === staged, 'expected same reference for unknown id');
    });

    t('moveToPositionRank: sole player at a position -> same reference regardless of requested rank', function () {
      var staged = makeMixedPositionStaged(); // q1 is the only QB
      var next = DC.edit.staging.moveToPositionRank(staged, 'q1', 5);
      assert(next === staged, 'expected same reference: no other QB to rank against');
    });

    t('moveToPositionRank: requesting the current rank in a tight (no interspersed) group is a true same-ref no-op', function () {
      var tight = [
        { id: 'r1', rank: 1, name: 'RB One', team: 'KC', position: 'RB', byeWeek: 9 },
        { id: 'r2', rank: 2, name: 'RB Two', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'r3', rank: 3, name: 'RB Three', team: 'MIA', position: 'RB', byeWeek: 10 }
      ];
      var next = DC.edit.staging.moveToPositionRank(tight, 'r2', 2);
      assert(next === tight, 'r2 is already RB rank 2 with no interspersed players; requesting rank 2 again is a no-op');
    });

    // ---- visibleSlotToOverallMove ----
    // Table below pins the preview==commit convention (the R2 gap-parity lesson) for a FILTERED
    // view: stagedIds has hidden rows (x, y) interspersed that are NOT in visibleIds.

    t('visibleSlotToOverallMove: no-op when toVisibleSlot equals fromVisibleIdx or fromVisibleIdx+1', function () {
      var stagedIds = ['a', 'x', 'b', 'y', 'c'];
      var visibleIds = ['a', 'b', 'c'];
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 1, 1), { fromIndex: 2, toIndex: 2 }, 'drop before itself');
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 1, 2), { fromIndex: 2, toIndex: 2 }, 'drop after itself, absorbing hidden row y — still a no-op');
    });

    t('visibleSlotToOverallMove: slot 0 lands immediately before the first visible row\'s overall position, absorbing any hidden row in between', function () {
      var stagedIds = ['a', 'x', 'b', 'y', 'c'];
      var visibleIds = ['a', 'b', 'c'];
      // mover = b (fromVisibleIdx 1, overall idx 2); drop at slot 0 (above a)
      var move = DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 1, 0);
      assertEq(move, { fromIndex: 2, toIndex: 0 });
      assertEq(DC.edit.staging.idsOf(DC.edit.staging.moveByIndex(stagedIds.map(function (id) { return { id: id }; }), move.fromIndex, move.toIndex)), ['b', 'a', 'x', 'y', 'c']);
    });

    t('visibleSlotToOverallMove: last slot lands after the last visible row', function () {
      var stagedIds = ['a', 'x', 'b', 'y', 'c'];
      var visibleIds = ['a', 'b', 'c'];
      // mover = a (fromVisibleIdx 0, overall idx 0); drop at slot 3 (= visibleIds.length, after c)
      var move = DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 0, 3);
      assertEq(move, { fromIndex: 0, toIndex: 4 });
      assertEq(DC.edit.staging.idsOf(DC.edit.staging.moveByIndex(stagedIds.map(function (id) { return { id: id }; }), move.fromIndex, move.toIndex)), ['x', 'b', 'y', 'c', 'a']);
    });

    t('visibleSlotToOverallMove: general anchor case — mover above the anchor absorbs a hidden row on the way down', function () {
      var stagedIds = ['a', 'x', 'b', 'y', 'c'];
      var visibleIds = ['a', 'b', 'c'];
      // mover = a (fromVisibleIdx 0); drop at slot 2 (between b and c)
      var move = DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 0, 2);
      assertEq(move, { fromIndex: 0, toIndex: 2 });
      assertEq(DC.edit.staging.idsOf(DC.edit.staging.moveByIndex(stagedIds.map(function (id) { return { id: id }; }), move.fromIndex, move.toIndex)), ['x', 'b', 'a', 'y', 'c'], 'a lands right after b, before hidden y');
    });

    t('visibleSlotToOverallMove: from/to adjustment edge — identity (unfiltered) case matches the pre-existing single-list convention exactly', function () {
      var stagedIds = ['a', 'b', 'c', 'd', 'e'];
      // downward: matches finishDrag's landedIndex>fromIndex -> toIndex = landedIndex-1
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, stagedIds, 1, 4), { fromIndex: 1, toIndex: 3 });
      // upward: matches finishDrag's landedIndex<fromIndex -> toIndex = landedIndex
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, stagedIds, 3, 1), { fromIndex: 3, toIndex: 1 });
      // true no-op: dropping at your own slot
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, stagedIds, 2, 2), { fromIndex: 2, toIndex: 2 });
    });

    t('visibleSlotToOverallMove: invalid fromVisibleIdx or a mover id absent from stagedIds -> {-1,-1}', function () {
      var stagedIds = ['a', 'b', 'c'];
      var visibleIds = ['a', 'b', 'c'];
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, -1, 1), { fromIndex: -1, toIndex: -1 });
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, visibleIds, 3, 1), { fromIndex: -1, toIndex: -1 });
      assertEq(DC.edit.staging.visibleSlotToOverallMove(stagedIds, ['ghost', 'b', 'c'], 0, 1), { fromIndex: -1, toIndex: -1 }, 'mover id not present in stagedIds');
    });

    // ---- slotFromPointerOffsets ----

    t('slotFromPointerOffsets: uniform rows match dropIndexFromPointer exactly', function () {
      var rowTops = [0, 40, 80, 120, 160];
      var rowHeights = [40, 40, 40, 40, 40];
      assertEq(DC.edit.geom.slotFromPointerOffsets(0, rowTops, rowHeights, 5), 0);
      assertEq(DC.edit.geom.slotFromPointerOffsets(20, rowTops, rowHeights, 5), 1, 'matches dropIndexFromPointer(20,0,40,10)=1');
      assertEq(DC.edit.geom.slotFromPointerOffsets(60, rowTops, rowHeights, 5), 2, 'matches dropIndexFromPointer(60,0,40,10)=2');
      assertEq(DC.edit.geom.slotFromPointerOffsets(100000, rowTops, rowHeights, 5), 5, 'far past bottom clamps to count');
      assertEq(DC.edit.geom.slotFromPointerOffsets(-100000, rowTops, rowHeights, 5), 0, 'far negative clamps to 0');
    });

    t('slotFromPointerOffsets: non-uniform rows (a tier-break row with extra margin-top) resolve by real midpoints, not a uniform step', function () {
      var rowTops = [0, 40, 90, 130, 220]; // row2 has extra top margin (gap 50 instead of 40)
      var rowHeights = [40, 50, 40, 90, 40];
      // midpoints: 20, 65, 110, 175, 240
      assertEq(DC.edit.geom.slotFromPointerOffsets(0, rowTops, rowHeights, 5), 0);
      assertEq(DC.edit.geom.slotFromPointerOffsets(100, rowTops, rowHeights, 5), 2, 'past row0/row1 midpoints (20,65), before row2 midpoint (110)');
      assertEq(DC.edit.geom.slotFromPointerOffsets(110, rowTops, rowHeights, 5), 3, 'exactly at row2 midpoint counts row2');
      assertEq(DC.edit.geom.slotFromPointerOffsets(300, rowTops, rowHeights, 5), 5);
      assertEq(DC.edit.geom.slotFromPointerOffsets(-5, rowTops, rowHeights, 5), 0);
    });

    t('slotFromPointerOffsets: count <= 0 -> 0', function () {
      assertEq(DC.edit.geom.slotFromPointerOffsets(50, [], [], 0), 0);
      assertEq(DC.edit.geom.slotFromPointerOffsets(50, [], [], -3), 0);
    });

    // ---- gapShiftAmounts ----
    // spec: array of {height, marginTop} per row; marginBottom is always 8 (matches .player-row;
    // only .tier-break ever sets marginTop, to 24). Numbers verified against real DOM
    // removal/insertion (getBoundingClientRect, real styles.css) before writing this table.

    function buildRowGeometry(spec) {
      var heights = spec.map(function (s) { return s.height; });
      var tops = [];
      var cursor = 20; // arbitrary baseline — a bug that assumes rows start at 0 would still show
      for (var i = 0; i < spec.length; i++) {
        if (i > 0) {
          cursor += heights[i - 1] + Math.max(8, spec[i].marginTop);
        }
        tops.push(cursor);
      }
      return { rowTops: tops, rowHeights: heights };
    }

    function normalRows(n) {
      var spec = [];
      for (var i = 0; i < n; i++) {
        spec.push({ height: 64, marginTop: 0 });
      }
      return spec;
    }

    t('gapShiftAmounts: uniform pitches — regression parity with the old ±rowStep behavior, both directions', function () {
      var g = buildRowGeometry(normalRows(6));
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 1, 4, 8), { 2: -72, 3: -72 }, 'downward: pitch = height(64)+gap(8) = 72');
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 4, 1, 8), { 1: 72, 2: 72, 3: 72 }, 'upward: same uniform pitch');
    });

    t('gapShiftAmounts: no-op (targetIdx === fromIdx) -> no shifts', function () {
      var g = buildRowGeometry(normalRows(6));
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 2, 2, 8), {});
    });

    t('gapShiftAmounts: a tier-break row INSIDE the displaced range does not change any shift amount, either direction', function () {
      var spec = normalRows(6);
      spec[3] = { height: 64, marginTop: 24 }; // row3 is the divider, well inside both ranges below
      var g = buildRowGeometry(spec);
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 1, 5, 8), { 2: -72, 3: -72, 4: -72 }, 'downward: uniform -72 despite row3 being a divider');
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 5, 1, 8), { 1: 72, 2: 72, 3: 72, 4: 72 }, 'upward: uniform 72 despite row3 being a divider');
    });

    t('gapShiftAmounts: a divider at the FIRST displaced index does not change the shift', function () {
      var specDown = normalRows(6);
      specDown[1] = { height: 64, marginTop: 24 }; // row1 = fromIdx(0)+1, first displaced row downward
      var gDown = buildRowGeometry(specDown);
      assertEq(DC.edit.geom.gapShiftAmounts(gDown.rowTops, gDown.rowHeights, 0, 4, 8), { 1: -72, 2: -72, 3: -72 });

      var specUp = normalRows(6);
      specUp[1] = { height: 64, marginTop: 24 }; // row1 = targetIdx, first displaced row upward
      var gUp = buildRowGeometry(specUp);
      assertEq(DC.edit.geom.gapShiftAmounts(gUp.rowTops, gUp.rowHeights, 5, 1, 8), { 1: 72, 2: 72, 3: 72, 4: 72 });
    });

    t('gapShiftAmounts: a divider at the LAST displaced index (adjacent to the dragged row) does not change the shift', function () {
      var specDown = normalRows(6);
      specDown[2] = { height: 64, marginTop: 24 }; // row2 = targetIdx(3)-1, last displaced row downward
      var gDown = buildRowGeometry(specDown);
      assertEq(DC.edit.geom.gapShiftAmounts(gDown.rowTops, gDown.rowHeights, 0, 3, 8), { 1: -72, 2: -72 });

      var specUp = normalRows(6);
      specUp[4] = { height: 64, marginTop: 24 }; // row4 = fromIdx(5)-1, last displaced row upward
      var gUp = buildRowGeometry(specUp);
      assertEq(DC.edit.geom.gapShiftAmounts(gUp.rowTops, gUp.rowHeights, 5, 1, 8), { 1: 72, 2: 72, 3: 72, 4: 72 });
    });

    t('gapShiftAmounts: the DRAGGED row itself being a divider is the one case that changes the pitch (24 replaces 8), both directions', function () {
      var spec = normalRows(6);
      spec[2] = { height: 64, marginTop: 24 }; // fromIdx itself is the divider
      var g = buildRowGeometry(spec);
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 2, 5, 8), { 3: -88, 4: -88 }, 'downward: pitch = 64+24 = 88');
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 2, 0, 8), { 0: 88, 1: 88 }, 'upward: same 88 pitch');
    });

    t('gapShiftAmounts: fromIdx === 0 has no row above to measure, so it uses fallbackGap', function () {
      var g = buildRowGeometry(normalRows(4));
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 0, 3, 8), { 1: -72, 2: -72 });
      assertEq(DC.edit.geom.gapShiftAmounts(g.rowTops, g.rowHeights, 0, 3, 20), { 1: -84, 2: -84 }, 'fallbackGap is actually consulted, not hardcoded');
    });

    // ---- tierBreakBefore ----

    t('tierBreakBefore: table of prev/view tier combinations', function () {
      var g = DC.edit.staging.tierBreakBefore;
      assertEq(g(null, { tier: null }), null, 'list start, untiered -> no break');
      assertEq(g(null, { tier: 1 }), 'Tier 1', 'list start, tiered -> break');
      assertEq(g({ tier: 1 }, { tier: 1 }), null, 'same tier -> no break');
      assertEq(g({ tier: 1 }, { tier: 2 }), 'Tier 2', 'tier boundary -> break');
      assertEq(g({ tier: null }, { tier: 2 }), 'Tier 2', 'prev untiered, this tiered -> break');
      assertEq(g({ tier: 2 }, { tier: null }), null, 'prev tiered, this untiered -> NO break');
      assertEq(g({ tier: null }, { tier: null }), null, 'both untiered -> no break');
    });

    // ---- clamp-on-move contract (drag-retier clamp) ----

    t('clamp-on-move: a T3 player dragged above a T2 neighbor clamps to 2 via DC.state.clampTierAt', function () {
      var players = [
        { id: 'a', position: 'RB', tier: 1 },
        { id: 'b', position: 'RB', tier: 2 },
        { id: 'c', position: 'RB', tier: 2 },
        { id: 'd', position: 'RB', tier: 3 }
      ];
      var moved = DC.edit.staging.moveByIndex(players, 3, 1);
      assertEq(DC.edit.staging.idsOf(moved), ['a', 'd', 'b', 'c']);
      var clamped = DC.state.clampTierAt(moved, 1, 3);
      assertEq(clamped, 2, 'T3 dragged between a T1 neighbor above and a T2 neighbor below clamps down to 2');
    });
  })();
  </script>

  <script>
  (function () {
    'use strict';
    section('roster-tracking');

    function buildMountFixture() {
      var root = document.createElement('div');
      root.style.display = 'none';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +
            '<div id="search-container"></div>' +
            '<div id="tracker-strip"></div>' +
            '<div id="filter-chips"></div>' +
            '<div id="summary-line"></div>' +
          '</header>' +
          '<main id="player-list"></main>' +
          '<div id="undo-banner-root"></div>' +
          '<nav id="bottom-bar"></nav>' +
          '<div id="sheet-root"></div>' +
        '</div>';
      document.body.appendChild(root);
      return root;
    }

    // Same auto-fire semantics as the established withSyncTimeouts pattern (edit.js tests):
    // every setTimeout call made anywhere during fn(), including nested ones scheduled from
    // inside an already-fired callback, runs synchronously and immediately.
    function withSyncTimeouts(fn) {
      var original = window.setTimeout;
      window.setTimeout = function (cb) {
        cb();
        return 0;
      };
      try {
        fn();
      } finally {
        window.setTimeout = original;
      }
    }

    // Finer-grained control for the long-press's two nested timers (arm-fires at 500ms,
    // which itself schedules the 150ms flash-then-dispatch): captures each setTimeout call
    // into a queue instead of firing it, so a test can flush exactly one nested level at a
    // time — needed to observe the real 0-150ms window where the button is still live and a
    // trailing click must be suppressed, before the dispatch removes the row from the DOM.
    function mockTimerQueue() {
      var original = window.setTimeout;
      var pending = [];
      window.setTimeout = function (cb) {
        pending.push(cb);
        return pending.length;
      };
      return {
        flushOne: function () {
          var cb = pending.shift();
          if (cb) {
            cb();
          }
        },
        restore: function () {
          window.setTimeout = original;
        }
      };
    }

    function spyDispatch(store) {
      var calls = [];
      var original = store.dispatch;
      store.dispatch = function (action) {
        calls.push(action);
        return original(action);
      };
      return { calls: calls, restore: function () { store.dispatch = original; } };
    }

    t('long-press: pointerdown, flush the 500ms arm timer, click while still live (suppressed), then flush the 150ms flash -> exactly ONE DRAFT_PLAYER dispatch with mine:true', function () {
      var fixture = buildMountFixture();
      var store = DC.state.createStore(DC.state.createSeedState());
      var spy = spyDispatch(store);
      try {
        DC.ui.mount(store);
        var firstId = DC.data.SEED_PLAYERS[0].id;
        var btn = fixture.querySelector('.btn-draft[data-id="' + firstId + '"]');
        assert(btn, 'expected a DRAFT button for the first seed player');

        var timers = mockTimerQueue();
        try {
          btn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));
          assert(btn.classList.contains('arming'), 'arming class should be applied on pointerdown');
          timers.flushOne(); // fires the 500ms arm timer: sets longPressFiredId, adds flash-mine+exiting, schedules the 150ms dispatch
          assert(!btn.classList.contains('arming'), 'arming class should be removed once the long-press fires');
          assertEq(spy.calls.length, 0, 'no dispatch yet - the 150ms flash-then-dispatch timer has not fired');

          btn.click(); // the browser's ensuing click, arriving while the button is still live
          assertEq(spy.calls.length, 0, 'click during the 0-150ms window must be suppressed, not dispatch a second time');

          timers.flushOne(); // fires the 150ms flash-then-dispatch timer
        } finally {
          timers.restore();
        }

        var draftDispatches = spy.calls.filter(function (a) { return a.type === 'DRAFT_PLAYER'; });
        assertEq(draftDispatches.length, 1, 'expected exactly one DRAFT_PLAYER dispatch');
        assertEq(draftDispatches[0].playerId, firstId);
        assertEq(draftDispatches[0].mine, true, 'long-press dispatch should carry mine:true');
      } finally {
        spy.restore();
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

    t('long-press flag does not leak past its own dispatch: after the row exits with no trailing click delivered (detached case), the NEXT normal tap on that id must not be swallowed', function () {
      var fixture = buildMountFixture();
      var store = DC.state.createStore(DC.state.createSeedState());
      var spy = spyDispatch(store);
      try {
        DC.ui.mount(store);
        var firstId = DC.data.SEED_PLAYERS[0].id;
        var btn = fixture.querySelector('.btn-draft[data-id="' + firstId + '"]');

        var timers = mockTimerQueue();
        try {
          btn.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));
          timers.flushOne(); // fires the 500ms arm timer: sets longPressFiredId, adds flash-mine+exiting, schedules the 150ms dispatch

        } finally {

        assertEq(spy.calls.filter(function (a) { return a.type === 'DRAFT_PLAYER'; }).length, 1, 'sanity: the long-press itself dispatched once');

  <!-- Round 4 Task 1: schema v4 — REORDER tiers param, SET_LEAGUE, IMPORT_PLAYERS tier normalize -->
  <script>
  (function () {
    'use strict';
    section('state');

    function makeBaseState() {
      var players = [
        { id: 'a', rank: 1, name: 'Aaron Ace', team: 'KC', position: 'QB', byeWeek: 9 },
        { id: 'b', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7 },
        { id: 'c', rank: 3, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10 },
        { id: 'd', rank: 4, name: 'Dave Deep', team: 'KC', position: 'TE', byeWeek: 9 },
        { id: 'e', rank: 5, name: 'Erik End', team: 'SEA', position: 'RB', byeWeek: 13 }
      ];
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false, mine: false };
      });
      return {
        schemaVersion: 4,
        players: players,
        marks: marks,
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: '',
        manuallyEdited: false,
        league: null
      };
    }

    t('REORDER_PLAYERS: tiers param applies per-id tiers then normalizes non-monotone tiers into position-scoped monotone order (mixed-position board)', function () {
      var state = makeBaseState(); // a=QB, b=RB, c=WR, d=TE, e=RB
      var next = DC.state.reduce(state, {
        type: 'REORDER_PLAYERS',
        order: ['a', 'b', 'c', 'd', 'e'],
        tiers: { a: 2, b: 3, c: 1, d: 1, e: 1 }
      });
      var tiers = next.players.map(function (p) { return p.tier; });
      assertEq(tiers, [2, 3, 1, 1, 3], 'e (RB) clamps 1->3 from same-position b; c/d untouched at 1');
      assertEq(tiers[2], 1, 'c (WR) is untouched despite higher tiers earlier at other positions');
      assertEq(tiers[3], 1, 'd (TE) is untouched despite higher tiers earlier at other positions');
      assertEq(tiers[4], 3, 'e (RB) is clamped up from same-position b, not from the intervening c/d');
    });

    t('REORDER_PLAYERS: without a tiers param, behaves byte-identically to the pre-tiers reducer (order/rank/manuallyEdited/marks/undoStack unaffected)', function () {
      var state = makeBaseState();
      state = DC.state.reduce(state, { type: 'DRAFT_PLAYER', playerId: 'a' });
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'c', 'a', 'd', 'b'] });
      assertEq(next.players.map(function (p) { return p.id; }), ['e', 'c', 'a', 'd', 'b']);
      assertEq(next.players.map(function (p) { return p.rank; }), [1, 2, 3, 4, 5]);
      assertEq(next.manuallyEdited, true);
      assert(next.marks === state.marks, 'marks should be same reference, exactly as before tiers existed');
      assert(next.undoStack === state.undoStack, 'undoStack should be same reference');
    });

    t('REORDER_PLAYERS: an order-only reorder on an untiered board produces byte-identical player objects to the pre-fix reducer (normalizeTiers is a true no-op here)', function () {
      var state = makeBaseState();
      var order = ['e', 'c', 'a', 'd', 'b'];
      var byId = {};
      state.players.forEach(function (p) { byId[p.id] = p; });
      var expected = order.map(function (id, idx) { return Object.assign({}, byId[id], { rank: idx + 1 }); });

      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: order });
      assertEq(next.players, expected, 'normalizeTiers must be a no-op on an all-untiered board, so back-compat is untouched by construction');
    });

    // per-position monotonicity: group players by position (board order preserved within each
    // group), then check each group's own tier subsequence is non-decreasing — a global check
    // across mixed positions is exactly the bug this round fixes, so it must not be reused here.
    function assertPositionMonotone(players, msg) {
      var byPosition = {};
      players.forEach(function (p) {
        (byPosition[p.position] = byPosition[p.position] || []).push(p.tier);
      });
      Object.keys(byPosition).forEach(function (pos) {
        var group = byPosition[pos];
        for (var i = 1; i < group.length; i++) {
          if (group[i - 1] === null || group[i - 1] === undefined || group[i] === null || group[i] === undefined) {
            continue;
          }
          assert(group[i] >= group[i - 1], (msg || 'tier must be monotone non-decreasing') + ' within position ' + pos + ': ' + JSON.stringify(group));
        }
      });
    }

    t('REORDER_PLAYERS: a board with tiers (set via a prior tiers-bearing reorder) stays position-scoped monotone through a LATER order-only reorder that would otherwise violate it', function () {
      var state = makeBaseState(); // a=QB, b=RB, c=WR, d=TE, e=RB
      state = DC.state.reduce(state, {
        type: 'REORDER_PLAYERS',
        order: ['a', 'b', 'c', 'd', 'e'],
        tiers: { a: 1, b: 2, c: 2, d: 3, e: 3 }
      });
      assertEq(state.players.map(function (p) { return p.tier; }), [1, 2, 2, 3, 3], 'precondition: tiered and position-monotone in this order');

      // reversing the order with no tiers param would otherwise persist b's tier below e's mid-session
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['e', 'd', 'c', 'b', 'a'] });
      var tiers = next.players.map(function (p) { return p.tier; });
      assertPositionMonotone(next.players, 'REORDER_PLAYERS result');
      assertEq(tiers, [3, 3, 2, 3, 1], 'b (RB) gets clamped up to the running max (3) carried in from e (RB); c/a (WR/QB) are untouched — the exact discriminator the shipped global-clamp bug would fail');
    });

    t('REORDER_PLAYERS: invalid per-id tier values (string, float, zero, negative) heal to null; unknown ids in the map are ignored', function () {
      var state = makeBaseState();
      var next = DC.state.reduce(state, {
        type: 'REORDER_PLAYERS',
        order: ['a', 'b', 'c', 'd', 'e'],
        tiers: { a: '2', b: 1.5, c: 0, d: -1, e: 1, zzz: 9 }
      });
      assertEq(next.players.map(function (p) { return p.tier; }), [null, null, null, null, 1]);
    });

    t('IMPORT_PLAYERS: normalizes incoming tiers before storing, position-scoped (non-monotone same-position tiers come out monotone; cross-position leak is dead); league carries over unchanged', function () {
      var state = makeBaseState();
      var league = { size: 10, slot: 2, snake: true, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 6 } };
      state = DC.state.reduce(state, { type: 'SET_LEAGUE', league: league });
      var newPlayers = [
        { id: 'b', rank: 1, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7, tier: 2 },
        { id: 'c', rank: 2, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10, tier: 1 },
        { id: 'z', rank: 3, name: 'Zeke New', team: 'NYG', position: 'RB', byeWeek: 12, tier: 1 }
      ];
      var next = DC.state.reduce(state, { type: 'IMPORT_PLAYERS', players: newPlayers });
      assertEq(next.players.map(function (p) { return p.tier; }), [2, 1, 2], 'z (RB) healed up to running max 2 from same-position b; c (WR) untouched at 1 despite b\'s higher tier');
      assertEq(next.league, league, 'league is untouched by a rankings import');
    });

    t('REORDER_PLAYERS: a tier clamp that rebuilds a player carries its adp object through untouched (CARRY, not heal)', function () {
      var players = [
        { id: 'a', rank: 1, name: 'Aaron Ace', team: 'KC', position: 'QB', byeWeek: 9, tier: 1, adp: { espn: 1, yahoo: 1, sleeper: 1 } },
        { id: 'b', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7, tier: 2, adp: { espn: 12, yahoo: 14, sleeper: 10 } },
        { id: 'e', rank: 3, name: 'Erik End', team: 'SEA', position: 'RB', byeWeek: 13, tier: 1, adp: { espn: 30, yahoo: 28, sleeper: 33 } }
      ];
      var marks = {};
      players.forEach(function (p) { marks[p.id] = { drafted: false, target: false, avoid: false, mine: false }; });
      var state = {
        schemaVersion: 5, players: players, marks: marks, undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' }, searchText: '', manuallyEdited: false, league: null
      };
      var next = DC.state.reduce(state, { type: 'REORDER_PLAYERS', order: ['a', 'b', 'e'] });
      var e = next.players.filter(function (p) { return p.id === 'e'; })[0];
      assertEq(e.tier, 2, 'precondition: e (RB) got clamped up to running max 2 from same-position b');
      assertEq(e.adp, { espn: 30, yahoo: 28, sleeper: 33 }, 'adp survives the tier-clamp rebuild untouched');
    });

    t('IMPORT_PLAYERS: non-monotone tiers force a clamp rebuild — every result player keeps the adp KEY (not merely a falsy value) through the rebuild', function () {
      var state = makeBaseState();
      var newPlayers = [
        { id: 'b', rank: 1, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7, tier: 2, adp: null },
        { id: 'c', rank: 2, name: 'Cody Catch', team: 'MIA', position: 'WR', byeWeek: 10, tier: 1, adp: null },
        { id: 'z', rank: 3, name: 'Zeke New', team: 'NYG', position: 'RB', byeWeek: 12, tier: 1, adp: null }
      ];
      var next = DC.state.reduce(state, { type: 'IMPORT_PLAYERS', players: newPlayers });
      next.players.forEach(function (p) {
        assertEq('adp' in p, true, 'adp key must be present on ' + p.id + ' — a bare p.adp==null check cannot tell dropped-key from null');
        assertEq(p.adp, null, 'adp value for ' + p.id);
      });
    });

    t('SET_LEAGUE: valid/invalid/null table — reducer accepts only exact-int, in-bounds leagues; rejects (same ref) anything else, including values healing would coerce', function () {
      var state = makeBaseState();

      var validLeague = { size: 12, slot: 4, snake: true, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 7 } };
      var afterValid = DC.state.reduce(state, { type: 'SET_LEAGUE', league: validLeague });
      assertEq(afterValid.league, validLeague);

      var afterNull = DC.state.reduce(afterValid, { type: 'SET_LEAGUE', league: null });
      assertEq(afterNull.league, null, 'null clears the league');

      var slotTooBig = { size: 8, slot: 9, snake: false, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 5 } };
      var r1 = DC.state.reduce(state, { type: 'SET_LEAGUE', league: slotTooBig });
      assert(r1 === state, 'slot > size must be rejected with the same reference');

      var sizeTooSmall = { size: 3, slot: 1, snake: false, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 5 } };
      var r2 = DC.state.reduce(state, { type: 'SET_LEAGUE', league: sizeTooSmall });
      assert(r2 === state, 'size below 4 must be rejected with the same reference');

  <!-- Round 4 Task 1: tier invariant helpers — clampTierAt / normalizeTiers / stepperBounds -->
  <script>
  (function () {
    'use strict';
    section('state');

    function makeInvariantPlayers(tiers) {
      var ids = ['i1', 'i2', 'i3', 'i4', 'i5', 'i6'];
      return ids.map(function (id, idx) {
        return { id: id, rank: idx + 1, name: 'Inv ' + idx, team: 'KC', position: 'RB', byeWeek: 9, tier: tiers[idx] };
      });
    }

    t('clampTierAt: table — mid-board clamps both directions, null desired passes through, index itself is skipped, unbounded on an all-null board', function () {
      var players = makeInvariantPlayers([1, null, 3, null, 5, null]);
      assertEq(DC.state.clampTierAt(players, 1, 10), 3, 'clamps down to the nearest tiered-below (3)');
      assertEq(DC.state.clampTierAt(players, 1, -5), 1, 'clamps up to the nearest tiered-above (1)');
      assertEq(DC.state.clampTierAt(players, 1, 2), 2, 'within bounds -> unchanged');
      assertEq(DC.state.clampTierAt(players, 1, null), null, 'a null desired tier always passes through');
      assertEq(DC.state.clampTierAt(players, 0, 100), 3, 'index 0 has no tiered-above; its own tier (1) is not used as a bound on itself');

      var allNull = makeInvariantPlayers([null, null, null, null, null, null]);
      assertEq(DC.state.clampTierAt(allNull, 3, 7), 7, 'an all-null board is fully unbounded');
    });

    t('normalizeTiers: table — already-monotone stays the same reference, a violation gets clamped upward, nulls are skipped in place', function () {
      var monotone = makeInvariantPlayers([1, 1, 2, null, 2, 4]);
      assert(DC.state.normalizeTiers(monotone) === monotone, 'already-monotone input returns the same array reference');

      var violated = makeInvariantPlayers([3, 1, null, 2, 5, 1]);
      var fixed = DC.state.normalizeTiers(violated);
      assert(fixed !== violated, 'a violation must return a new array');
      assertEq(fixed.map(function (p) { return p.tier; }), [3, 3, null, 3, 5, 5]);
      assertEq(fixed.map(function (p) { return p.id; }), violated.map(function (p) { return p.id; }), 'order/ids preserved');
    });

    t('stepperBounds: table — bounded both sides, top-of-board (no above), bottom-of-board (no below), all-null board is fully open; untiered player also gets start, tiered player does not', function () {
      var players = makeInvariantPlayers([1, null, 3, null, 5, null]);
      assertEq(DC.state.stepperBounds(players, 1), { min: 1, max: 3, start: 1 }, 'untiered mid-board: bounded both sides, start defaults to nearest-above');
      assertEq(DC.state.stepperBounds(players, 0), { min: 1, max: 3 }, 'a TIERED player (index 0) gets no start key; top of board has no tiered-above so min defaults to 1');
      assertEq(DC.state.stepperBounds(players, 5), { min: 5, max: null, start: 5 }, 'bottom of board: no tiered-below, max is unbounded (null)');

      var allNull = makeInvariantPlayers([null, null, null, null, null, null]);
      assertEq(DC.state.stepperBounds(allNull, 2), { min: 1, max: null, start: 1 }, 'an all-null board is fully open, start defaults to 1');
    });
  })();
  </script>

  <!-- Round 5 Task 1: position-scoped tier invariant — mixed-position regressions for the shipped global-clamp bug -->
  <script>
  (function () {

    // mixed-position fixture: a physically-nearer different-position tiered neighbor must never

        { id: 'b1', rank: 2, name: 'B One', team: 'DAL', position: 'RB', byeWeek: 7, tier: null },

      ];
    }

    t('clampTierAt: mixed-position board — bound comes from the nearest SAME-position tiered neighbor, not the physically-nearer different-position one', function () {
      var players = makeMixedPlayers();
      assertEq(DC.state.clampTierAt(players, 1, 10), 3, 'b1 (RB) is bound by b2 (RB, tier 3) below it, not by a2 (QB, tier 4) which is physically nearer — the old global-scoped code would return 4');
    });

    t('stepperBounds: mixed-position board — no same-position tiered neighbor above opens min to 1, even though a different-position neighbor is physically above', function () {
      var players = makeMixedPlayers();

      var players = [

        { id: 'b', rank: 2, name: 'Bobby Back', team: 'DAL', position: 'RB', byeWeek: 7, tier: 3 },

      assertEq(fixed.map(function (p) { return p.tier; }), [2, 3, 1, 1, 3], 'e (RB) clamps up to running max 3 from same-position b; c (WR) and d (TE) are untouched despite earlier higher tiers at other positions');
    });

    t('clampTierAt: floor asymmetry pin — with no same-position-above, a sub-1 (even negative) desired tier passes through unclamped', function () {
      var players = makeMixedPlayers();
      assertEq(DC.state.clampTierAt(players, 0, -3), -3, 'a1 has no tiered-above (top of board); clampTierAt floors at -Infinity here, assuming caller-healed input');
    });

    t('stepperBounds: floor asymmetry pin — the same no-tiered-above spot floors min at 1, unlike clampTierAt', function () {
      var players = makeMixedPlayers();

    });

    t('tierColorClass: table — ints 1..6 map to tier-c1..tier-c6, ints >=7 map to tier-cx, everything else (null/undefined/non-int/<1) is null', function () {
      assertEq(DC.state.tierColorClass(1), 'tier-c1');
      assertEq(DC.state.tierColorClass(2), 'tier-c2');
      assertEq(DC.state.tierColorClass(3), 'tier-c3');
      assertEq(DC.state.tierColorClass(4), 'tier-c4');
      assertEq(DC.state.tierColorClass(5), 'tier-c5');
      assertEq(DC.state.tierColorClass(6), 'tier-c6');
      assertEq(DC.state.tierColorClass(7), 'tier-cx');
      assertEq(DC.state.tierColorClass(100), 'tier-cx');
      assertEq(DC.state.tierColorClass(null), null);
      assertEq(DC.state.tierColorClass(undefined), null);
      assertEq(DC.state.tierColorClass(0), null);
      assertEq(DC.state.tierColorClass(-1), null);
      assertEq(DC.state.tierColorClass(1.5), null);

    // THE round's acceptance test: dragging a QB to the front of an interleaved mixed-position
    // board must never touch any other position's tiers — this is the exact shipped bug (a T4
    // QB dragged to QB1 clamped every tiered player below it, all positions, up to >=4).
    t('REORDER_PLAYERS regression: dragging qb4 to the front of an interleaved 9-player board only staged-clamps qb4 — every other player\'s tier is byte-identical to before', function () {
      var before = [
        { id: 'qb1', rank: 1, name: 'QB One', team: 'KC', position: 'QB', byeWeek: 9, tier: 1 },
        { id: 'rb1', rank: 2, name: 'RB One', team: 'DAL', position: 'RB', byeWeek: 7, tier: 1 },
        { id: 'qb2', rank: 3, name: 'QB Two', team: 'MIA', position: 'QB', byeWeek: 10, tier: 2 },
        { id: 'wr1', rank: 4, name: 'WR One', team: 'SEA', position: 'WR', byeWeek: 13, tier: 1 },
        { id: 'qb3', rank: 5, name: 'QB Three', team: 'BUF', position: 'QB', byeWeek: 5, tier: 3 },
        { id: 'te1', rank: 6, name: 'TE One', team: 'NYG', position: 'TE', byeWeek: 12, tier: 1 },
        { id: 'qb4', rank: 7, name: 'QB Four', team: 'PHI', position: 'QB', byeWeek: 8, tier: 4 },
        { id: 'rb2', rank: 8, name: 'RB Two', team: 'CIN', position: 'RB', byeWeek: 6, tier: 2 },
        { id: 'wr2', rank: 9, name: 'WR Two', team: 'LAR', position: 'WR', byeWeek: 11, tier: 2 }
      ];
      var beforeById = {};
      before.forEach(function (p) { beforeById[p.id] = p.tier; });

      var marks = {};
      before.forEach(function (p) { marks[p.id] = { drafted: false, target: false, avoid: false, mine: false }; });
      var state = {
        schemaVersion: 4, players: before, marks: marks, undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' }, searchText: '', manuallyEdited: false, league: null
      };

      // tiers map = before-values with qb4 overridden to 1 — exactly what the UI's own clamp
      // (a correct staging pass) would have computed before dispatching the drag.
      var stagedTiers = {};
      before.forEach(function (p) { stagedTiers[p.id] = p.tier; });
      stagedTiers.qb4 = 1;

      var next = DC.state.reduce(state, {
        type: 'REORDER_PLAYERS',
        order: ['qb4', 'qb1', 'rb1', 'qb2', 'wr1', 'qb3', 'te1', 'rb2', 'wr2'],
        tiers: stagedTiers
      });

      var qb4 = next.players.filter(function (p) { return p.id === 'qb4'; })[0];
      assertEq(qb4.tier, 1, 'qb4 lands at its staged tier 1');
      next.players.forEach(function (p) {
        if (p.id === 'qb4') {
          return;
        }
        assertEq(p.tier, beforeById[p.id], p.id + '\'s tier must be byte-identical to before — dragging qb4 must never touch other players\' tiers, at any position');
      });
    });
  })();

      for (var r = 21; r <= 39; r++) { draftedRanks.push(r); }
      var state = makeValueState(draftedRanks);
      var ids = DC.state.valueFlagIds(state);
      assertEq(!!ids.v5, true, 'consensus drift exactly VALUE_DRIFT_MIN (20-5=15) flags');
      assertEq(!!ids.v6, false, 'consensus drift VALUE_DRIFT_MIN-1 (20-6=14) does not flag');
    });

    t('valueFlagIds: consensus ceiling boundary — consensus at VALUE_RANK_CEILING (75) is eligible, one past it is excluded even with sufficient drift', function () {
      var draftedRanks = [];
      for (var r = 111; r <= 220; r++) { draftedRanks.push(r); }
      var state = makeValueState(draftedRanks);
      var ids = DC.state.valueFlagIds(state);
      assertEq(!!ids.v75, true, 'consensus 75 at the ceiling with drift 36 -> flagged');
      assertEq(!!ids.v76, false, 'consensus 76 exceeds the ceiling despite sufficient drift (35)');
    });

    t('valueFlagIds: a player with no resolvable ADP (consensus null) never flags, even with drift that would otherwise qualify', function () {
      var draftedRanks = [];
      for (var r = 21; r <= 39; r++) { draftedRanks.push(r); }
      var state = makeValueState(draftedRanks);
      var ids = DC.state.valueFlagIds(state);
      assertEq(DC.state.adpConsensus(state.players.filter(function (p) { return p.id === 'vnoadp'; })[0]), null, 'fixture sanity: vnoadp must have no resolvable consensus');
      assertEq(!!ids.vnoadp, false, 'currentPick 20 minus rank 5 would be drift 15 under the old rank rule, but consensus null must never flag');
    });

    function makeRosterPlayers() {
      return [
        { id: 'r1', rank: 1, name: 'R One', team: 'KC', position: 'QB', byeWeek: 9, tier: null },
        { id: 'r2', rank: 2, name: 'R Two', team: 'DAL', position: 'RB', byeWeek: 7, tier: null },
        { id: 'r3', rank: 3, name: 'R Three', team: 'MIA', position: 'RB', byeWeek: 10, tier: null },
        { id: 'r4', rank: 4, name: 'R Four', team: 'KC', position: 'WR', byeWeek: 9, tier: null },
        { id: 'r5', rank: 5, name: 'R Five', team: 'SEA', position: 'TE', byeWeek: 13, tier: null },
        { id: 'r6', rank: 6, name: 'R Six', team: 'NYG', position: 'QB', byeWeek: 12, tier: null },
        { id: 'r7', rank: 7, name: 'R Seven', team: 'BUF', position: 'RB', byeWeek: 5, tier: null }
      ];
    }

    function makeRosterState(pickOrder, league) {
      var players = makeRosterPlayers();
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false, mine: false };
      });
      var undoStack = [];
      pickOrder.forEach(function (id, idx) {
        marks[id] = { drafted: true, target: false, avoid: false, mine: true };
        undoStack.push({ playerId: id, timestamp: idx });
      });
      return { schemaVersion: 4, players: players, marks: marks, undoStack: undoStack, filters: { position: 'ALL', status: 'AVAILABLE' }, searchText: '', manuallyEdited: false, league: league };
    }

    t('rosterNeeds: fills the direct position slot first, then FLEX for RB/WR/TE overflow, then bench; QB never flexes; null without a league', function () {
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 1, RB: 1, WR: 1, TE: 1, FLEX: 1, BENCH: 2 } };
      var state = makeRosterState(['r1', 'r6', 'r2', 'r3', 'r7'], league);
      var needs = DC.state.rosterNeeds(state);
      assertEq(needs.QB, { filled: 1, req: 1 });
      assertEq(needs.RB, { filled: 1, req: 1 });
      assertEq(needs.FLEX, { filled: 1, req: 1 });
      assertEq(needs.BENCH, { filled: 2 });
      assertEq(needs.WR, { filled: 0, req: 1 });
      assertEq(needs.TE, { filled: 0, req: 1 });

      var noLeague = makeRosterState(['r1'], null);
      assertEq(DC.state.rosterNeeds(noLeague), null, 'null without a league');
    });

    t('rosterNeeds: K-slot-full cascades straight to BENCH, never FLEX (FLEX stays RB/WR/TE-only); DST mirrors the same behavior', function () {
      var players = [
        { id: 'k1', rank: 1, name: 'K One', team: 'BAL', position: 'K', byeWeek: 9, tier: null },
        { id: 'k2', rank: 2, name: 'K Two', team: 'SF', position: 'K', byeWeek: 7, tier: null },
        { id: 'd1', rank: 3, name: 'D One', team: 'NYJ', position: 'DST', byeWeek: 10, tier: null },
        { id: 'd2', rank: 4, name: 'D Two', team: 'PHI', position: 'DST', byeWeek: 9, tier: null }
      ];
      var marks = {};
      players.forEach(function (p) { marks[p.id] = { drafted: false, target: false, avoid: false, mine: false }; });
      var undoStack = [];
      ['k1', 'k2', 'd1', 'd2'].forEach(function (id, idx) {
        marks[id] = { drafted: true, target: false, avoid: false, mine: true };
        undoStack.push({ playerId: id, timestamp: idx });
      });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 7 } };
      var state = { schemaVersion: 4, players: players, marks: marks, undoStack: undoStack, filters: { position: 'ALL', status: 'AVAILABLE' }, searchText: '', manuallyEdited: false, league: league };
      var needs = DC.state.rosterNeeds(state);
      assertEq(needs.K, { filled: 1, req: 1 }, 'first K pick fills the K slot');
      assertEq(needs.DST, { filled: 1, req: 1 }, 'first DST pick fills the DST slot');
      assertEq(needs.FLEX, { filled: 0, req: 1 }, 'K/DST never spill into FLEX');
      assertEq(needs.BENCH, { filled: 2 }, 'the second K pick and second DST pick both fall through straight to BENCH');
    });
  })();

    t('load(): a non-conforming league heals to null (wrong type, missing fields, slot > size, out-of-range size, non-boolean snake)', function () {

        'not an object',
        { size: 12 },

      localStorage.removeItem(DC.state.STORAGE_KEY);
      var state = DC.state.createSeedState();
      var ids = state.players.slice(0, 3).map(function (p) { return p.id; });
      var tiersMap = {};

  })();

  <script>
  (function () {
    'use strict';
    section('board-ui');

    function buildMountFixture() {
      var root = document.createElement('div');
      root.style.display = 'none';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +

          '<nav id="bottom-bar"></nav>' +
          '<div id="sheet-root"></div>' +
        '</div>';
      document.body.appendChild(root);
      return root;
    }

    function spyDispatch(store) {
      var calls = [];
      var original = store.dispatch;
      store.dispatch = function (action) {
        calls.push(action);
        return original(action);
      };
      return { calls: calls, restore: function () { store.dispatch = original; } };
    }

    var DEFAULT_LEAGUE_EXPECTED = { size: 12, slot: 1, snake: true, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 7 } };

      var fixture = buildMountFixture();
      var store = DC.state.createStore(DC.state.createSeedState());
      var spy = spyDispatch(store);
      try {
        DC.ui.mount(store);
        fixture.querySelector('[data-action="open-settings"]').click();

        var setupBtn = fixture.querySelector('[data-action="league-setup-open"]');
        assert(setupBtn, 'expected a "Set up draft tracker" row when league is unset');
        setupBtn.click();

        var sizeRow = fixture.querySelector('[data-action="league-size-step"]').closest('.tier-stepper-row');

        var snakeBtn = fixture.querySelector('[data-action="league-snake-toggle"]');
        assertEq(snakeBtn.getAttribute('aria-pressed'), 'true', 'snake defaults on');

        var applyBtn = fixture.querySelector('[data-action="league-apply"]');
        assert(applyBtn, 'expected an Apply button while pending');
        applyBtn.click();

        var leagueDispatches = spy.calls.filter(function (a) { return a.type === 'SET_LEAGUE'; });
        assertEq(leagueDispatches.length, 1, 'Apply should dispatch SET_LEAGUE exactly once');
        assertEq(leagueDispatches[0].league, DEFAULT_LEAGUE_EXPECTED);
        assertEq(store.getState().league, DEFAULT_LEAGUE_EXPECTED);

        assert(!fixture.querySelector('[data-action="league-apply"]'), 'Apply row should be gone after applying');
        assert(fixture.querySelector('[data-action="league-clear"]'), 'Clear row should appear once a league exists');
      } finally {
        spy.restore();
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

    t('league setup flow: closing the sheet before Apply discards the draft — reopening shows "Set up draft tracker" again', function () {

        DC.ui.mount(store);
        fixture.querySelector('[data-action="open-settings"]').click();

        assertEq(store.getState().league, null, 'closing without Apply must never touch the store');
      } finally {
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }

      var store = DC.state.createStore(Object.assign({}, DC.state.createSeedState(), { league: league }));

    function buildSignalBoard() {
      var players = [];
      function addPlayer(id, position, tier, adp) {
        players.push({ id: id, rank: players.length + 1, name: id, team: 'KC', position: position, byeWeek: 9, tier: tier === undefined ? null : tier, adp: adp });
      }
      addPlayer('valDrift1', 'RB', null, { espn: 1, yahoo: 1, sleeper: 1 }); // rank1, consensus 1 — stays available, drift-eligible -> VALUE only
      addPlayer('val1', 'RB', null, { espn: 2, yahoo: 2, sleeper: 2 }); // rank2, consensus 2 — stays available, drift-eligible -> VALUE only
      addPlayer('wrA', 'WR', 1); // rank3, no adp -> consensus null — gets drafted, leaving wrB as the sole tier-1 WR
      addPlayer('wrB', 'WR', 1); // rank4, no adp -> consensus null — stays available -> CLIFF only (not drift-eligible)
      for (var i = 1; i <= 17; i++) {
        addPlayer('filler' + i, i % 2 === 0 ? 'TE' : 'QB'); // rank5..21; filler1-15 get drafted as drift filler (VALUE_DRIFT_MIN=15 needs the extra depth), 16-17 stay available with no signals
      }
      var marks = {};
      players.forEach(function (p) { marks[p.id] = { drafted: false, target: false, avoid: false, mine: false }; });
      return {
        schemaVersion: DC.state.CURRENT_SCHEMA_VERSION,
        players: players,
        marks: marks,
        undoStack: [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: '',
        manuallyEdited: false,
        league: null
      };
    }

    function draftSignalBoardFillers(store, mineForFiller1) {
      store.dispatch({ type: 'DRAFT_PLAYER', playerId: 'wrA', mine: false });
      for (var i = 1; i <= 15; i++) {
        store.dispatch({ type: 'DRAFT_PLAYER', playerId: 'filler' + i, mine: i === 1 && mineForFiller1 });
      }
      // picksMade=16, currentPick=17 now: valDrift1 drift=16, val1 drift=15 (both clear VALUE_DRIFT_MIN=15)
      store.dispatch({ type: 'SET_LEAGUE', league: { size: 10, slot: 3, snake: false, roster: { QB: 1, RB: 2, WR: 3, TE: 1, FLEX: 1, BENCH: 6 } } });
    }

    // ---- Round 6 Task 3 review fix: per-chip fit at a real 390px width (row-level
    // scrollWidth===clientWidth is non-discriminating — .chip has flex:1/min-width:0, so the ROW
    // always fits; it's each individual CHIP's own box that can be too narrow for its text) ----

    function buildPinned390Fixture() {
      var root = document.createElement('div');
      root.style.position = 'fixed';
      root.style.top = '0';
      root.style.left = '0';
      root.style.width = '390px'; // real layout, not display:none — descendants resolve widths against this
      root.style.visibility = 'hidden';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +
            '<div id="search-container"></div>' +
            '<div id="tracker-strip"></div>' +
            '<div id="filter-chips"></div>' +
            '<div id="summary-line"></div>' +
          '</header>' +
          '<main id="player-list"></main>' +
          '<div id="undo-banner-root"></div>' +
          '<nav id="bottom-bar"></nav>' +
          '<div id="sheet-root"></div>' +
        '</div>';
      document.body.appendChild(root);
      return root;
    }

    // true (sub-pixel) unclamped content width of a chip, via a throwaway clone with no
    // width/flex constraints — scrollWidth/clientWidth are integers that clamp scrollWidth to
    // clientWidth whenever content fits (they can prove "no overflow" but never a positive
    // margin), so this is the only way to see how much real slack a fitting chip has.
    function naturalChipContentWidth(chip) {
      var cs = getComputedStyle(chip);
      var clone = document.createElement('span');
      clone.style.position = 'absolute';
      clone.style.visibility = 'hidden';
      clone.style.whiteSpace = 'nowrap';
      clone.style.display = 'inline-flex';
      clone.style.alignItems = 'center';
      clone.style.gap = cs.gap;
      clone.style.fontSize = cs.fontSize;
      clone.style.fontWeight = cs.fontWeight;
      clone.style.fontFamily = cs.fontFamily;
      clone.innerHTML = chip.innerHTML;
      document.body.appendChild(clone);
      var w = clone.getBoundingClientRect().width;
      document.body.removeChild(clone);
      return w;
    }

    t('position chip row at a real, pinned 390px width: no chip overflows its own box, and the tightest chip still keeps >=1px of real sub-pixel margin', function () {
      var fixture = buildPinned390Fixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var chips = fixture.querySelectorAll('.chip-row-positions .chip');
        assertEq(chips.length, 8, 'expected 8 position chips');

        var worstMargin = Infinity;
        Array.prototype.forEach.call(chips, function (c) {
          // scrollWidth is clamped to clientWidth whenever content fits (never less) — this is a
          // real, if coarse, overflow guard: a strict "did not overflow" contract, not a margin measure.
          assert(c.scrollWidth <= c.clientWidth, c.textContent + ' overflows its own chip box at 390px: scrollWidth=' + c.scrollWidth + ' clientWidth=' + c.clientWidth);

          var cs = getComputedStyle(c);
          var padH = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
          var contentBoxFrac = c.getBoundingClientRect().width - padH;
          var margin = contentBoxFrac - naturalChipContentWidth(c);
          if (margin < worstMargin) {
            worstMargin = margin;
          }
        });

        assert(worstMargin >= 1, 'the tightest chip should keep >=1px of real sub-pixel margin beyond its own text (font-rendering variance headroom) — worstMargin=' + worstMargin.toFixed(2));
      } finally {
        document.body.removeChild(fixture);
        localStorage.removeItem(DC.state.STORAGE_KEY);
      }
    });

  <!-- Round: search-blur deferral (Task 1) — the search->draft two-tap bug -->
  <script>
  (function () {
    'use strict';
    section('search-collapse');

    function buildMountFixture() {
      var root = document.createElement('div');
      root.style.display = 'none';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +
            '<div id="search-container"></div>' +
            '<div id="tracker-strip"></div>' +
            '<div id="filter-chips"></div>' +
            '<div id="summary-line"></div>' +
          '</header>' +
          '<main id="player-list"></main>' +
          '<div id="undo-banner-root"></div>' +
          '<nav id="bottom-bar"></nav>' +
          '<div id="sheet-root"></div>' +
        '</div>';
      document.body.appendChild(root);
      return root;
    }

    function mockTimerQueue() {
      var original = window.setTimeout;
      var pending = [];
      window.setTimeout = function (cb) {
        pending.push(cb);
        return pending.length;
      };
      return {
        flushOne: function () {
          var cb = pending.shift();
          if (cb) {
            cb();
          }
        },
        restore: function () {
          window.setTimeout = original;
        }
      };
    }

    function mockRaf() {
      var original = window.requestAnimationFrame;
      var pending = [];
      window.requestAnimationFrame = function (cb) {
        pending.push(cb);
        return pending.length;
      };
      return {
        flush: function () {
          var callbacks = pending;
          pending = [];
          callbacks.forEach(function (cb) { cb(); });
        },
        restore: function () {
          window.requestAnimationFrame = original;
        }
      };
    }

    t('pointer-less blur (e.g. keyboard dismiss) defers the searching-class removal by a flat ~100ms timeout', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');

        searchInput.dispatchEvent(new FocusEvent('focus'));
        assert(document.body.classList.contains('searching'), 'focus should add body.searching synchronously');

        var timers = mockTimerQueue();
        try {
          searchInput.dispatchEvent(new FocusEvent('blur'));
          assert(document.body.classList.contains('searching'), 'blur with no pointers down must not remove the class synchronously');

          timers.flushOne();
          assert(!document.body.classList.contains('searching'), 'flushing the deferred timeout should remove body.searching');
        } finally {
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('blur while a pointer is down waits for pointerup, then removal happens on the next animation frame', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');
        var playerList = fixture.querySelector('#player-list');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        var raf = mockRaf();
        try {
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));
          searchInput.dispatchEvent(new FocusEvent('blur'));
          assert(document.body.classList.contains('searching'), 'blur while a pointer is down must not remove the class yet');

          playerList.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 1 }));
          assert(document.body.classList.contains('searching'), 'the rAF removal is only captured, not yet run, right after pointerup');

          raf.flush();
          assert(!document.body.classList.contains('searching'), 'flushing the captured rAF callback should remove body.searching');

          timers.flushOne(); // the 700ms backstop, arriving late — must be a harmless no-op
          assert(!document.body.classList.contains('searching'), 'a late backstop firing after the rAF already removed the class must not error or resurrect it');
        } finally {
          raf.restore();
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('a dropped pointerup is rescued by the 700ms backstop timeout', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');
        var playerList = fixture.querySelector('#player-list');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        try {
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));
          searchInput.dispatchEvent(new FocusEvent('blur'));
          // no matching pointerup/pointercancel ever arrives

          timers.flushOne(); // fires the 700ms backstop
          assert(!document.body.classList.contains('searching'), 'the backstop timeout should remove body.searching even with no pointerup');
        } finally {
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('with two pointers down, removal waits until the last one lifts', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');
        var playerList = fixture.querySelector('#player-list');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        var raf = mockRaf();
        try {
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 2, button: 0 }));
          searchInput.dispatchEvent(new FocusEvent('blur'));

          playerList.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 1 }));
          assert(document.body.classList.contains('searching'), 'one of two pointers lifting must not remove the class yet');
          raf.flush();
          assert(document.body.classList.contains('searching'), 'no removal should have been scheduled onto the rAF queue while a second pointer is still down');

          playerList.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 2 }));
          raf.flush();
          assert(!document.body.classList.contains('searching'), 'once the last pointer lifts, the flushed rAF callback should remove body.searching');
        } finally {
          raf.restore();
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('refocusing before a deferred removal fires invalidates it via the generation guard', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        try {
          searchInput.dispatchEvent(new FocusEvent('blur')); // queues the flat 100ms removal
          searchInput.dispatchEvent(new FocusEvent('focus'));
          assert(document.body.classList.contains('searching'), 'refocusing should keep body.searching present');

          timers.flushOne(); // the stale timer from the earlier blur, now out of generation
          assert(document.body.classList.contains('searching'), 'a stale removal from a superseded generation must not strip the class after refocus');
        } finally {
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('a pointer landing mid-flat-timer holds the class until pointerup + rAF', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');
        var playerList = fixture.querySelector('#player-list');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        var raf = mockRaf();
        try {
          searchInput.dispatchEvent(new FocusEvent('blur')); // no pointers down yet -- queues the flat 100ms removal
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));

          timers.flushOne(); // fires the 100ms timer with a pointer now down
          assert(document.body.classList.contains('searching'), 'a pointer landing before the flat timer fires must hold the class');

          playerList.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, cancelable: true, pointerId: 1 }));
          raf.flush();
          assert(!document.body.classList.contains('searching'), 'lifting the pointer should still remove the class via the rAF path');
        } finally {
          raf.restore();
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });

    t('the re-armed backstop rescues a dropped pointerup after a mid-flat-timer landing', function () {
      var fixture = buildMountFixture();
      try {
        var store = DC.state.createStore(DC.state.createSeedState());
        DC.ui.mount(store);
        var searchInput = fixture.querySelector('.search-input');
        var playerList = fixture.querySelector('#player-list');

        searchInput.dispatchEvent(new FocusEvent('focus'));

        var timers = mockTimerQueue();
        try {
          searchInput.dispatchEvent(new FocusEvent('blur')); // queues the flat 100ms removal
          playerList.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true, pointerId: 1, button: 0 }));

          timers.flushOne(); // fires the 100ms timer -- converts to pending, must arm a fresh 700ms backstop
          assert(document.body.classList.contains('searching'), 'converting to pending must not remove the class yet');
          // no matching pointerup/pointercancel ever arrives

          timers.flushOne(); // fires the newly-armed 700ms backstop
          assert(!document.body.classList.contains('searching'), 'the re-armed backstop should rescue the dropped pointerup');
        } finally {
          timers.restore();
        }
      } finally {
        document.body.classList.remove('searching');
        fixture.remove();
      }
    });
  })();
  </script>

  <!-- Task 2: positionRanks / fillAssignments / rosterBoard selectors -->
  <script>
  (function () {
    'use strict';
    section('roster-board');

    function fakePlayer(id, rank, position) {
      return { id: id, rank: rank, name: id, team: 'KC', position: position, byeWeek: 9, tier: null };
    }

    function makeBoardMarks(players) {
      var marks = {};
      players.forEach(function (p) {
        marks[p.id] = { drafted: false, target: false, avoid: false, mine: false };
      });
      return marks;
    }

    function makeBoardState(players, opts) {
      opts = opts || {};
      return {
        schemaVersion: 4,
        players: players,
        marks: opts.marks || makeBoardMarks(players),
        undoStack: opts.undoStack || [],
        filters: { position: 'ALL', status: 'AVAILABLE' },
        searchText: '',
        manuallyEdited: false,
        league: opts.league !== undefined ? opts.league : null
      };
    }

    t('positionRanks: interleaved positions count independently, every player gets an entry', function () {
      var players = [
        fakePlayer('q1', 1, 'QB'),
        fakePlayer('r1', 2, 'RB'),
        fakePlayer('q2', 3, 'QB'),
        fakePlayer('w1', 4, 'WR'),
        fakePlayer('r2', 5, 'RB'),
        fakePlayer('t1', 6, 'TE')
      ];
      var ranks = DC.state.positionRanks(makeBoardState(players));
      assertEq(ranks.q1, 1, 'first QB');
      assertEq(ranks.q2, 2, 'second QB');
      assertEq(ranks.r1, 1, 'first RB');
      assertEq(ranks.r2, 2, 'second RB');
      assertEq(ranks.w1, 1, 'first WR');
      assertEq(ranks.t1, 1, 'first TE');
      players.forEach(function (p) {
        assert(typeof ranks[p.id] === 'number', 'every player should have an entry: ' + p.id);
      });
    });

    t('positionRanks: real seed — first player of each position gets rank 1', function () {
      var state = DC.state.createSeedState();
      var ranks = DC.state.positionRanks(state);
      var seenPosition = {};
      state.players.forEach(function (p) {
        if (!seenPosition[p.position]) {
          seenPosition[p.position] = true;
          assertEq(ranks[p.id], 1, 'first ' + p.position + ' should have positionRank 1');
        }
      });
    });

    t('fillAssignments: null without a league', function () {
      var state = makeBoardState([fakePlayer('a', 1, 'RB')], { league: null });
      assertEq(DC.state.fillAssignments(state), null);
    });

    t('fillAssignments: cascade — direct slot, then FLEX, then BENCH, in undoStack order', function () {
      var players = [
        fakePlayer('rb1', 1, 'RB'),
        fakePlayer('rb2', 2, 'RB'),
        fakePlayer('rb3', 3, 'RB'),
        fakePlayer('rb4', 4, 'RB')
      ];
      var marks = makeBoardMarks(players);
      ['rb1', 'rb2', 'rb3', 'rb4'].forEach(function (id) {
        marks[id] = { drafted: true, target: false, avoid: false, mine: true };
      });
      var undoStack = ['rb1', 'rb2', 'rb3', 'rb4'].map(function (id, idx) { return { playerId: id, timestamp: idx }; });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 0, RB: 2, WR: 0, TE: 0, FLEX: 1, DST: 0, K: 0, BENCH: 2 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });
      var assignments = DC.state.fillAssignments(state);
      assertEq(assignments, [
        { playerId: 'rb1', slot: 'RB' },
        { playerId: 'rb2', slot: 'RB' },
        { playerId: 'rb3', slot: 'FLEX' },
        { playerId: 'rb4', slot: 'BENCH' }
      ]);
    });

    t('fillAssignments: mine-only, undoStack order, unknown playerId skipped', function () {
      var players = [
        fakePlayer('a', 1, 'RB'),
        fakePlayer('b', 2, 'RB')
      ];
      var marks = makeBoardMarks(players);
      marks.a = { drafted: true, target: false, avoid: false, mine: false };
      marks.b = { drafted: true, target: false, avoid: false, mine: true };
      var undoStack = [
        { playerId: 'unknown-id', timestamp: 0 },
        { playerId: 'a', timestamp: 1 },
        { playerId: 'b', timestamp: 2 }
      ];
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 0, RB: 1, WR: 0, TE: 0, FLEX: 0, DST: 0, K: 0, BENCH: 1 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });
      var assignments = DC.state.fillAssignments(state);
      assertEq(assignments, [{ playerId: 'b', slot: 'RB' }], 'unknown id and non-mine entries should be skipped, order preserved');
    });

    t('rosterBoard: null without a league', function () {
      var state = makeBoardState([fakePlayer('a', 1, 'RB')], { league: null });
      assertEq(DC.state.rosterBoard(state), null);
    });

    t('rosterBoard: zero-pick template — default roster yields 16 tiles in Order A with correct multiplicities, all player:null', function () {
      var state = makeBoardState([], { league: { size: 10, slot: 1, snake: true, roster: DC.state.DEFAULT_ROSTER } });
      var tiles = DC.state.rosterBoard(state);
      assertEq(tiles.length, 16, 'expected 16 tiles');
      var expectedSlots = ['QB', 'RB', 'RB', 'WR', 'WR', 'TE', 'FLEX', 'DST', 'K', 'BENCH', 'BENCH', 'BENCH', 'BENCH', 'BENCH', 'BENCH', 'BENCH'];
      assertEq(tiles.map(function (tl) { return tl.slot; }), expectedSlots, 'slots should follow Order A with correct multiplicities');
      tiles.forEach(function (tl) {
        assertEq(tl.player, null);
      });
    });

    t('rosterBoard: filled — picks land in the first unfilled tile of their slot; player is the same reference', function () {
      var players = [
        fakePlayer('rb1', 1, 'RB'),
        fakePlayer('rb2', 2, 'RB'),
        fakePlayer('wr1', 3, 'WR')
      ];
      var marks = makeBoardMarks(players);
      ['rb1', 'rb2', 'wr1'].forEach(function (id) { marks[id] = { drafted: true, target: false, avoid: false, mine: true }; });
      var undoStack = ['rb1', 'rb2', 'wr1'].map(function (id, idx) { return { playerId: id, timestamp: idx }; });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 1, RB: 2, WR: 2, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 7 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });
      var tiles = DC.state.rosterBoard(state);
      var rbTiles = tiles.filter(function (tl) { return tl.slot === 'RB'; });
      assert(rbTiles[0].player === players[0], 'first RB tile should hold rb1 by reference');
      assert(rbTiles[1].player === players[1], 'second RB tile should hold rb2 by reference');
      var wrTiles = tiles.filter(function (tl) { return tl.slot === 'WR'; });
      assert(wrTiles[0].player === players[2], 'first WR tile should hold wr1 by reference');
    });

    t('rosterBoard: bench overflow appends extra tiles, never hides a pick', function () {
      var players = [
        fakePlayer('rb1', 1, 'RB'),
        fakePlayer('rb2', 2, 'RB'),
        fakePlayer('rb3', 3, 'RB')
      ];
      var marks = makeBoardMarks(players);
      ['rb1', 'rb2', 'rb3'].forEach(function (id) { marks[id] = { drafted: true, target: false, avoid: false, mine: true }; });
      var undoStack = ['rb1', 'rb2', 'rb3'].map(function (id, idx) { return { playerId: id, timestamp: idx }; });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 0, RB: 0, WR: 0, TE: 0, FLEX: 0, DST: 0, K: 0, BENCH: 1 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });
      var tiles = DC.state.rosterBoard(state);
      var benchTiles = tiles.filter(function (tl) { return tl.slot === 'BENCH'; });
      assertEq(benchTiles.length, 3, 'expected 3 BENCH tiles even though roster.BENCH is 1 — 2 overflow tiles appended');
      assertEq(tiles.length, 3, 'total tile count should reflect the overflow');
      assertEq(benchTiles.map(function (tl) { return tl.player.id; }), ['rb1', 'rb2', 'rb3'], 'no pick should be hidden');
    });

    t('undrafting an earlier pick reshuffles later picks into freed slots — accepted semantics', function () {
      var players = [
        fakePlayer('a', 1, 'RB'),
        fakePlayer('b', 2, 'RB'),
        fakePlayer('c', 3, 'RB')
      ];
      var marks = makeBoardMarks(players);
      ['a', 'b', 'c'].forEach(function (id) { marks[id] = { drafted: true, target: false, avoid: false, mine: true }; });
      var undoStack = ['a', 'b', 'c'].map(function (id, idx) { return { playerId: id, timestamp: idx }; });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 0, RB: 2, WR: 0, TE: 0, FLEX: 1, DST: 0, K: 0, BENCH: 0 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });

      var before = DC.state.fillAssignments(state);
      assertEq(before, [
        { playerId: 'a', slot: 'RB' },
        { playerId: 'b', slot: 'RB' },
        { playerId: 'c', slot: 'FLEX' }
      ]);

      var undraftedMarks = Object.assign({}, marks, { a: { drafted: false, target: false, avoid: false, mine: false } });
      var undraftedUndoStack = undoStack.filter(function (e) { return e.playerId !== 'a'; });
      var afterState = makeBoardState(players, { marks: undraftedMarks, undoStack: undraftedUndoStack, league: league });

      var after = DC.state.fillAssignments(afterState);
      assertEq(after, [
        { playerId: 'b', slot: 'RB' },
        { playerId: 'c', slot: 'RB' }
      ], 'b and c reshuffle into the freed RB slot — accepted semantics, not a bug');
    });

    t('rosterNeeds: byte-identical output shape after the fillAssignments refactor', function () {
      var players = [
        fakePlayer('q1', 1, 'QB'),
        fakePlayer('r1', 2, 'RB'),
        fakePlayer('r2', 3, 'RB'),
        fakePlayer('w1', 4, 'WR')
      ];
      var marks = makeBoardMarks(players);
      ['q1', 'r1', 'r2', 'w1'].forEach(function (id) { marks[id] = { drafted: true, target: false, avoid: false, mine: true }; });
      var undoStack = ['q1', 'r1', 'r2', 'w1'].map(function (id, idx) { return { playerId: id, timestamp: idx }; });
      var league = { size: 10, slot: 1, snake: true, roster: { QB: 1, RB: 1, WR: 1, TE: 1, FLEX: 1, DST: 1, K: 1, BENCH: 7 } };
      var state = makeBoardState(players, { marks: marks, undoStack: undoStack, league: league });
      var needs = DC.state.rosterNeeds(state);
      assertEq(needs, {
        QB: { filled: 1, req: 1 },
        RB: { filled: 1, req: 1 },
        WR: { filled: 1, req: 1 },
        TE: { filled: 0, req: 1 },
        FLEX: { filled: 1, req: 1 },
        DST: { filled: 0, req: 1 },
        K: { filled: 0, req: 1 },
        BENCH: { filled: 0 }
      });
    });
  })();
  </script>

  <!-- Round 8 Task 1: my-pick draft-button flip -- tap/long-press inversion while it's your pick -->
  <script>
  (function () {
    'use strict';
    section('my-pick-flip');

    function buildMountFixture() {
      var root = document.createElement('div');
      root.style.display = 'none';
      root.innerHTML =
        '<div id="app">' +
          '<header id="header">' +
            '<div id="search-container"></div>' +
